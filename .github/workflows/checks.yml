name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser
        env:
          ZAD_BROWSER: ${{ matrix.engine }}
