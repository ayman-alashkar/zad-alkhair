name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser
        env:
          ZAD_BROWSER: ${{ matrix.engine }}
  database:
    runs-on: ubuntu-latest
    services:
      db:
        # نفس إصدار PostgreSQL في الإنتاج (17)، بصورة Supabase التي تحمل أدوارها وامتداداتها
        image: supabase/postgres:17.6.1.177
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Extensions the baseline expects
        run: psql -X -v ON_ERROR_STOP=1 -U supabase_admin -c "create extension if not exists pg_net with schema extensions"
      - name: Build from the repo, compare with production, run tests
        run: scripts/db-test.sh
        env:
          PGUSER: postgres
          ZAD_DB_FINGERPRINT_EXPECTED: supabase/checks/fingerprint.expected
  functions:
    # وظائف Supabase ووحدات الواجهة، بأدوات Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every edge function
        working-directory: supabase/functions
        run: for f in */index.ts; do deno check "$f"; done
      - name: Lint
        run: deno lint supabase/functions
      - name: Shared library tests
        run: deno test --allow-env supabase/functions/_shared
      # وحدات الواجهة (.mjs) تستورد كل ما تستعمله: اسم غير معرّف يعني اعتمادًا خفيًا على الأقسام القديمة
      - name: Front-end modules use only what they import
        run: node scripts/check-module-names.cjs
