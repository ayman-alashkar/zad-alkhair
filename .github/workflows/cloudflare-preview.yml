name: Temporary Cloudflare preview
# Ephemeral review workflow; remove before merge.

on:
  push:
    branches:
      - codex/final-domain-transition
    paths:
      - .github/workflows/cloudflare-preview.yml

permissions:
  contents: read
  statuses: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Run static migration checks
        shell: bash
        run: |
          node tests/domain-migration.test.cjs --static
          node validate-tafsir.mjs

      - name: Run browser migration checks
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/zad-preview-server.log 2>&1 &
          preview_server=$!
          trap 'kill "${preview_server}" 2>/dev/null || true' EXIT
          node tests/domain-migration.test.cjs

      - name: Prepare public assets
        shell: bash
        run: |
          preview_dir="${RUNNER_TEMP}/zad-preview"
          mkdir -p "${preview_dir}"
          git archive HEAD -- . ':(exclude)supabase' ':(exclude)tests' ':(exclude).github' | tar -x -C "${preview_dir}"
          echo "PREVIEW_DIR=${preview_dir}" >> "${GITHUB_ENV}"

      - name: Deploy isolated 60-minute preview
        shell: bash
        run: |
          output_file="${RUNNER_TEMP}/wrangler-output.txt"
          npx --yes wrangler@4.126.0 deploy --temporary --assets "${PREVIEW_DIR}" --name zad-alkhair-preview --compatibility-date 2026-08-26 | tee "${output_file}"
          preview_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "${output_file}" | head -n 1)
          test -n "${preview_url}"
          echo "PREVIEW_URL=${preview_url}" >> "${GITHUB_ENV}"

      - name: Expose only the temporary preview URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=cloudflare/temporary-preview \
            -f description="Temporary isolated preview" \
            -f target_url="${PREVIEW_URL}"
