    @font-face{
      font-family:"Aref Ruqaa";
      src:url("../fonts/aref-ruqaa-arabic-700.woff2") format("woff2");
      font-weight:700;
      font-display:swap;
    }
    @font-face{
      font-family:"Alexandria";
      src:url("../fonts/alexandria-arabic-400-800.woff2") format("woff2");
      font-weight:400 800;
      font-display:swap;
    }

    :root{
      --green:#0F5C50;
      --green-deep:#0A473E;
      --green-ink:#063B35;
      --gold:#C59A4A;
      --gold-soft:#E4C980;
      --gold-deep:#A97B2C;
      --cream:#FFF9EA;
      --cream-deep:#F8EFDE;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;margin:0}
    body{
      font-family:"Alexandria",Tahoma,Arial,sans-serif;
      color:var(--green-deep);
      background:
        linear-gradient(rgba(197,154,74,.025),rgba(197,154,74,.025)),
        var(--cream);
      display:grid;
      place-items:center;
      padding:18px;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;inset:0;
      pointer-events:none;
      opacity:.42;
      background-image:
        linear-gradient(45deg,transparent 46%,rgba(197,154,74,.055) 47%,rgba(197,154,74,.055) 48%,transparent 49%),
        linear-gradient(-45deg,transparent 46%,rgba(15,92,80,.025) 47%,rgba(15,92,80,.025) 48%,transparent 49%);
      background-size:96px 96px;
    }

    .frame{
      width:min(560px,100%);
      min-height:min(760px,calc(100dvh - 36px));
      position:relative;
      border:1.5px solid var(--gold);
      border-radius:40px;
      padding:34px 30px 26px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      background:rgba(255,249,234,.84);
      box-shadow:0 14px 34px rgba(10,71,62,.07);
    }

    .diamond{
      position:absolute;
      right:50%;
      width:14px;height:14px;
      background:var(--gold);
      transform:translateX(50%) rotate(45deg);
    }
    .diamond.top{top:-7px}
    .diamond.bottom{bottom:-7px}

    .identity{
      display:grid;
      justify-items:center;
      text-align:center;
    }

    .motto{
      margin:0 0 11px;
      font:700 2.25rem/1 "Aref Ruqaa",serif;
      color:var(--gold);
    }

    .mark{
      width:126px;height:126px;
      border-radius:30px;
      display:grid;place-items:center;
      background:var(--green-deep);
      border:1px solid rgba(197,154,74,.30);
      margin-bottom:19px;
    }
    .mark svg{width:94px;height:94px;display:block}

    h1{
      margin:0;
      font:700 4.5rem/.95 "Aref Ruqaa",serif;
      color:var(--green);
    }

    .divider{
      width:240px;
      max-width:64vw;
      display:grid;
      grid-template-columns:1fr 12px 1fr;
      align-items:center;
      gap:18px;
      margin:15px auto 18px;
    }
    .divider::before,.divider::after{content:"";height:1px;background:rgba(197,154,74,.72)}
    .divider i{width:10px;height:10px;background:var(--gold);transform:rotate(45deg);justify-self:center}

    .services{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-bottom:24px;
    }
    .service{
      display:grid;
      justify-items:center;
      text-align:center;
      gap:8px;
      min-width:0;
      color:var(--green-ink);
      font-size:.82rem;
      font-weight:650;
    }
    .service svg{
      width:32px;height:32px;
      fill:none;
      stroke:#9A6D25;
      stroke-width:1.55;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .actions{display:grid;gap:10px}

    .btn-content{display:inline-flex;align-items:center;justify-content:center;gap:10px;flex-direction:row-reverse}
    .btn-content svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    button,.open{
      min-height:56px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      font-family:"Alexandria",sans-serif;
      font-size:1rem;
      font-weight:750;
      cursor:pointer;
      transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
    }
    #install{
      border:0;
      color:#fff;
      background:linear-gradient(180deg,var(--green),var(--green-deep));
      box-shadow:0 9px 20px rgba(15,92,80,.18);
    }
    #install:disabled{opacity:.56;cursor:default;box-shadow:none}
    .open{
      color:var(--green);
      border:1px solid rgba(15,92,80,.22);
      background:rgba(255,249,234,.45);
    }
    @media (hover:hover){
      #install:not(:disabled):hover,.open:hover{transform:translateY(-1px)}
    }

    #hint{
      margin:16px 5px 0;
      min-height:3.6em;
      text-align:center;
      color:#72684f;
      font-size:.88rem;
      line-height:1.9;
    }

    .manual{
      margin-top:6px;
      padding:13px 15px;
      border-top:1px solid rgba(197,154,74,.22);
      color:#776846;
      text-align:center;
      font-size:.82rem;
      line-height:1.9;
    }
    .manual strong{color:var(--green-deep)}
    .hidden{display:none!important}

    @media (max-width:600px){
      body{padding:10px}

      .mark svg{width:82px;height:82px}
      h1{font-size:3.7rem}
      .divider{margin:13px auto 16px}
      .services{gap:5px;margin-bottom:20px}
      .service{font-size:.72rem;gap:6px}
      .service svg{width:28px;height:28px}
      button,.open{min-height:53px;font-size:.95rem}
    }

    .identity .mark{width:80px;height:80px;border-radius:22px;margin-bottom:12px}
    .identity .mark svg{width:62px;height:62px}
    .identity h1{font-size:3.1rem}
    .identity .motto{font-size:1.6rem}
    .identity .divider{margin:12px auto 16px}
    .install-title{font:700 1.9rem/1.7 "Aref Ruqaa",serif;text-align:center;margin:0;color:var(--green-deep)}
    .install-intro{text-align:center;font-size:.78rem;line-height:1.9;margin:6px 0 18px;color:#72684f}
    .device-options{display:flex;gap:6px;padding:5px;border:1px solid rgba(197,154,74,.3);border-radius:15px;background:var(--cream-deep);margin-bottom:12px}
    .device-options button{flex:1;min-width:0;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--green-deep);font-size:.75rem;font-weight:600;padding:6px;box-shadow:none}
    .device-options button[aria-pressed="true"]{background:var(--green-deep);color:var(--cream)}
    .manual{text-align:start;padding:16px;margin:0 0 14px;border:1px solid rgba(197,154,74,.3);border-radius:18px;background:rgba(197,154,74,.045)}
    .manual h3{margin:0 0 12px;font-size:.84rem;color:var(--green-deep)}
    .install-steps{list-style:none;counter-reset:install-step;padding:0;margin:0;display:grid;gap:14px}
    .install-steps li{display:flex;align-items:center;gap:12px;font-size:.85rem;line-height:1.95;color:var(--green-ink);counter-increment:install-step}
    .step-symbol{position:relative;display:grid;place-items:center;flex:none;width:42px;height:42px;border:1px solid rgba(197,154,74,.3);border-radius:12px;background:var(--cream-deep);color:var(--green)}
    .step-symbol::before{content:counter(install-step);position:absolute;inset-inline-start:-5px;top:-7px;width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:var(--green-deep);color:var(--cream);font-size:10px}
    .step-symbol svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .manual .browser-note{font-size:.7rem;line-height:1.9;margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(197,154,74,.25);color:var(--green-ink)}
    #install{background:linear-gradient(135deg,#F1DFA8,#D5B16A 65%,#C69B4B);color:#253B2F;border:1px solid #BC934A;box-shadow:0 8px 22px -12px rgba(90,61,19,.5)}
    #hint{min-height:0;font-size:.76rem;line-height:1.9}
    :focus-visible{outline:3px solid var(--gold-deep);outline-offset:3px}
    html[data-theme=dark]{color-scheme:dark;--green:#E4C980;--green-deep:#FFF5DC;--green-ink:#E4DDC8;--cream:#061F1D;--cream-deep:#0D3029;--gold:#BFA163}
    html[data-theme=dark] .frame{background:#082621;box-shadow:0 24px 60px rgba(0,0,0,.25)}
    html[data-theme=dark] .install-intro,html[data-theme=dark] #hint{color:#C1BBA7}
    html[data-theme=dark] .mark{background:#0A473E}
    html[data-theme=dark] .open{background:var(--cream-deep);border-color:rgba(228,201,128,.3)}
    @media(prefers-reduced-motion:reduce){button,.open{transition:none}}
  </style>

<script>
(()=>{
  const btn=document.getElementById('install');
  const hint=document.getElementById('hint');
  const manual=document.getElementById('manual');
  const open=document.getElementById('open');
  let promptEvent=null;

  /* Preserve a safe in-app destination supplied by the legacy-install bridge. */
  try{
    const next=new URLSearchParams(location.search).get('next');
    if(next&&next.startsWith('/')&&!next.startsWith('//')){
      const target=new URL(next,location.origin);
      if(target.origin===location.origin)open.href=target.href;
    }
  }catch(_){ }

  /* Anonymous PWA install analytics: one random UUID per browser profile. */
  const ZK_PWA_ID='zad:pwa-install-id';
  const ZK_SUPABASE_URL='https://webqpbcijjbawatykoxe.supabase.co';
  const ZK_SUPABASE_KEY='sb_publishable_51JPJ2XgwWW5l66bwqHN3Q_CJrEtyZv';
  const ZK_APP_VERSION='v115';


  try{
    [
      'zad:pwa-standalone-reported-v1',
      'zad:pwa-standalone-reported-v2',
      'zad:pwa-standalone-pending-v1',
      'zad:pwa-standalone-pending-v2',
      'zad:pwa-install-accepted-reported-v1'
    ].forEach(k=>localStorage.removeItem(k));
  }catch(_){ }

  function pwaUuid(){
    try{
      let id=localStorage.getItem(ZK_PWA_ID);
      if(id&&/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)) return id;
      if(crypto.randomUUID) id=crypto.randomUUID();
      else{
        const b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
        const h=[...b].map(v=>v.toString(16).padStart(2,'0')).join('');
        id=`${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
      }
      localStorage.setItem(ZK_PWA_ID,id);return id;
    }catch(_){return null;}
  }
  function pwaPlatform(){
    const u=navigator.userAgent||'';
    if(/Android/i.test(u)) return 'android';
    if(/iPad|iPhone|iPod/i.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)) return 'ios';
    if(/Windows|Macintosh|Linux/i.test(u)) return 'desktop';
    return 'other';
  }
  async function recordInstallAccepted(){
    try{
      const id=pwaUuid();if(!id)return;
      await fetch(`${ZK_SUPABASE_URL}/rest/v1/rpc/record_pwa_install`,{
        method:'POST',keepalive:true,
        headers:{'Content-Type':'application/json',apikey:ZK_SUPABASE_KEY,Authorization:`Bearer ${ZK_SUPABASE_KEY}`},
        body:JSON.stringify({p_device_id:id,p_platform:pwaPlatform(),p_event:'install_accepted',p_app_version:ZK_APP_VERSION})
      });
    }catch(_){ }
  }

  const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  const ua=navigator.userAgent||'';
  const isIOS=/iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

  const label=document.getElementById('install-label');
  const deviceButtons=[...document.querySelectorAll('[data-device]')];
  const embedded=/FBAN|FBAV|Instagram|Line\/|; wv\)|Telegram/i.test(ua);
  let selectedDevice=isIOS?'ios':/Android/i.test(ua)?'android':'desktop';
  const symbols={
    menu:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
    share:'<path d="M12 16V3m-4 4 4-4 4 4M5 12v8h14v-8"/>',
    add:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8m-4-4h8"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    open:'<path d="M14 4h6v6M10 14 20 4M10 4H4v16h16v-6"/>'
  };
  function paintInstallAction(){
    btn.disabled=false;
    label.textContent=promptEvent?'ثبّت الآن':'عرض خطوات التثبيت';
  }
  function showManual(){
    const steps=selectedDevice==='ios'?[
      ['open','افتح زاد الخير في متصفح Safari.'],
      ['share','اضغط زر المشاركة في المتصفح.'],
      ['add','اختر «إضافة إلى الشاشة الرئيسية»؛ قد تحتاج إلى تمرير قائمة المشاركة أو فتح «المزيد».'],
      ['check','اضغط «إضافة» لتظهر أيقونة زاد الخير على شاشتك الرئيسية.']
    ]:selectedDevice==='android'?[
      ['menu','افتح قائمة المتصفح ⋮، ويُفضّل استخدام Chrome.'],
      ['add','اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»، بحسب ما يظهر في متصفحك.'],
      ['check','أكّد الإضافة، ثم افتح زاد الخير من أيقونته على جهازك.']
    ]:[
      ['open','افتح زاد الخير في Chrome أو Edge على الحاسب.'],
      ['add','اضغط أيقونة التثبيت في شريط العنوان، أو افتح قائمة المتصفح واختر خيار تثبيت الصفحة كتطبيق.'],
      ['check','أكّد التثبيت ليفتح زاد الخير في نافذة خاصة به.']
    ];
    manual.classList.remove('hidden');
    manual.innerHTML='<h3>خطوات التثبيت '+(selectedDevice==='ios'?'على آيفون وآيباد':selectedDevice==='android'?'على أندرويد':'على الحاسب')+'</h3><ol class="install-steps">'+steps.map(([icon,text])=>'<li><span class="step-symbol" aria-hidden="true"><svg viewBox="0 0 24 24">'+symbols[icon]+'</svg></span><span>'+text+'</span></li>').join('')+'</ol>'+(embedded?'<p class="browser-note">إذا فتحت الرابط داخل تطبيق مراسلة، افتحه أولاً في المتصفح الخارجي من قائمة التطبيق، ثم اتبع الخطوات أعلاه.</p>':'');
    deviceButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.device===selectedDevice)));
  }
  deviceButtons.forEach(button=>button.addEventListener('click',()=>{selectedDevice=button.dataset.device;showManual()}));
  showManual();
  paintInstallAction();

  if(standalone){
    btn.classList.add('hidden');
    manual.classList.add('hidden');
    document.querySelector('.device-options').classList.add('hidden');
    hint.textContent='زاد الخير مثبت على جهازك بالفعل.';
    return;
  }

  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    promptEvent=e;
    btn.disabled=false;
    hint.textContent='اضغط الزر، ثم وافق على نافذة التثبيت.';
    paintInstallAction();
  });

  btn.addEventListener('click',async()=>{
    if(!promptEvent){
      hint.textContent='استخدم خطوات التثبيت المناسبة لمتصفحك.';
      showManual();
      manual.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
      return;
    }
    btn.disabled=true;
    const pending=promptEvent;promptEvent=null;
    let choice=null;
    try{await pending.prompt();choice=await pending.userChoice}catch(_){ }
    paintInstallAction();
    if(choice&&choice.outcome==='accepted'){
      btn.classList.add('hidden');
      hint.textContent='تمت الموافقة على التثبيت. ستجد زاد الخير بين تطبيقاتك.';
      manual.classList.add('hidden');
    }else{
      btn.disabled=false;
      hint.textContent='يمكنك تثبيت زاد الخير متى شئت.';
    }
  });

  window.addEventListener('appinstalled',()=>{
    recordInstallAccepted();
    btn.classList.add('hidden');
    hint.textContent='تم تثبيت زاد الخير بنجاح.';
    manual.classList.add('hidden');
  });

  if(!standalone)hint.textContent=embedded?'للتثبيت، افتح الرابط في المتصفح الخارجي أولاً.':isIOS?'اتبع خطوات Safari أعلاه لإضافة التطبيق.':'يمكنك اتباع الخطوات أعلاه؛ سيظهر زر «ثبّت الآن» عند إتاحة التثبيت المباشر.';
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

})();
</script>
</body>
</html>
