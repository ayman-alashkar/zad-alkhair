<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0F5C50">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>الانتقال إلى زاد الخير</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/zad-mark.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:"Alexandria";src:url("../fonts/alexandria-arabic-400-800.woff2") format("woff2");font-weight:400 800;font-display:swap}
    @font-face{font-family:"Aref Ruqaa";src:url("../fonts/aref-ruqaa-arabic-700.woff2") format("woff2");font-weight:700;font-display:swap}
    *{box-sizing:border-box}
    :root{color-scheme:light;--green:#0F5C50;--green-deep:#0A473E;--gold:#C59A4A;--cream:#FFF9EA;--ink:#173D35;--muted:#6F6859;--danger:#A33F45}
    html,body{min-height:100%;margin:0}
    body{min-height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));font-family:"Alexandria",Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% -8%,rgba(228,201,128,.18),transparent 31rem),linear-gradient(154deg,#041A18,#0A3C34)}
    .card{width:min(520px,100%);position:relative;overflow:hidden;padding:31px 24px 24px;border:1px solid rgba(197,154,74,.72);border-radius:30px;text-align:center;background:var(--cream);box-shadow:0 28px 75px rgba(0,0,0,.3)}
    .card::before{content:"";position:absolute;inset:0 0 auto;height:7px;background:linear-gradient(90deg,var(--green),var(--gold),var(--green))}
    .mark{width:76px;height:76px;margin:0 auto 15px;padding:13px;border-radius:22px;display:grid;place-items:center;background:var(--green-deep);border:1px solid rgba(197,154,74,.48)}
    .mark img{width:100%;height:100%;display:block}
    h1{margin:0;font-family:"Aref Ruqaa",serif;font-size:2rem;line-height:1.4;color:var(--green)}
    p{max-width:43ch;margin:13px auto 0;color:var(--muted);font-size:.94rem;line-height:1.95}
    .actions{display:grid;gap:10px;margin-top:23px}
    .actions a,.retry{min-height:53px;padding:12px 17px;border-radius:17px;display:flex;align-items:center;justify-content:center;text-decoration:none;font:750 .96rem/1.5 "Alexandria",Tahoma,Arial,sans-serif}
    .primary,.retry{color:#fff;background:linear-gradient(180deg,var(--green),var(--green-deep));border:0;box-shadow:0 9px 22px rgba(15,92,80,.2)}
    .secondary{color:var(--green);background:#fffdf5;border:1px solid rgba(15,92,80,.24)}
    .retry{width:100%;cursor:pointer}
    .spinner{width:34px;height:34px;margin:22px auto 7px;border:3px solid rgba(15,92,80,.18);border-top-color:var(--green);border-radius:50%;animation:spin .85s linear infinite}
    .error{color:var(--danger);font-weight:700}
    [hidden]{display:none!important}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:520px){.card{padding:28px 18px 21px;border-radius:25px}h1{font-size:1.75rem}}
    @media(prefers-reduced-motion:reduce){.spinner{animation-duration:1.6s}}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="mark" aria-hidden="true"><img src="../icons/zad-mark-reverse.svg" alt=""></div>

    <section id="progress">
      <h1>جارٍ الانتقال إلى النسخة النهائية</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p>يرجى الانتظار لحظات…</p>
    </section>

    <section id="success" hidden>
      <h1>تم الانتقال بنجاح</h1>
      <p id="success-message"></p>
      <div class="actions">
        <a class="primary" id="open-app" href="../">فتح ختمتي</a>
        <a class="secondary" id="install-app" href="../install/">تثبيت التطبيق الجديد</a>
      </div>
    </section>

    <section id="failure" hidden>
      <h1>لم يكتمل الانتقال</h1>
      <p class="error" id="failure-message">لم تُحذف أو تتغير أي بيانات. تحقق من الاتصال ثم أعد المحاولة.</p>
      <div class="actions"><button class="retry" id="retry" type="button">إعادة المحاولة</button></div>
    </section>
  </main>

<script>
(()=>{
  const HANDOFF_URL="https://webqpbcijjbawatykoxe.supabase.co/functions/v1/migration-handoff";
  const SUPABASE_KEY="sb_publishable_51JPJ2XgwWW5l66bwqHN3Q_CJrEtyZv";
  const TOKEN_KEY="zad:migration-token-v1";
  const NEXT_KEY="zad:migration-next-v1";
  const PACKAGE_KEY="zad:migration-package-v1";
  const CLEANUP_TOKEN_KEY="zad:migration-cleanup-token-v1";
  const COMPLETE_KEY="zad:migration-complete-v1";
  const LEGACY_CLEANUP="https://ayman-alashkar.github.io/zad-alkhair/cleanup/";
  const SAFE_PREF_KEYS=new Set([
    "zad:prayer","zad:qcf4:qari","zad:qcf4:continuous","zad:qcf4:recent-visits",
    "zad:qcf4:last-position","zad:qcf4:last-surface-v1","zad:qcf4:reader-parent-v1",
    "zad:qcf4:page-bookmarks","zad:qcf4:ayah-bookmarks","zad:qcf4:bookmarks","zad:qcf4:theme"
  ]);
  const progress=document.getElementById("progress");
  const success=document.getElementById("success");
  const failure=document.getElementById("failure");
  const message=document.getElementById("success-message");
  const openApp=document.getElementById("open-app");
  const installApp=document.getElementById("install-app");

  function validToken(value){return /^[A-Za-z0-9_-]{43}$/.test(String(value||""))}

  async function tokenHash(token){
    if(!crypto.subtle||typeof TextEncoder!=="function")throw new Error("cleanup_proof_unavailable");
    const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(token));
    return Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,"0")).join("");
  }

  function sameValue(left,right){
    left=String(left||"");right=String(right||"");
    if(left.length!==right.length)return false;
    let different=0;for(let i=0;i<left.length;i++)different|=left.charCodeAt(i)^right.charCodeAt(i);
    return different===0;
  }

  function safeNext(value){
    try{
      if(!value||!String(value).startsWith("/")||String(value).startsWith("//"))return "/";
      const target=new URL(String(value),location.origin);
      if(target.origin!==location.origin||target.pathname.startsWith("/transfer"))return "/";
      return target.pathname+target.search+target.hash;
    }catch(_){return "/"}
  }

  function readArrival(){
    let token="",cleaned="",next="/";
    try{
      const params=new URLSearchParams(location.hash.replace(/^#/,""));
      token=params.get("token")||"";cleaned=params.get("cleaned")||"";next=safeNext(params.get("next")||"/");
      if(validToken(token)){sessionStorage.setItem(TOKEN_KEY,token);sessionStorage.setItem(NEXT_KEY,next)}
      else{token=sessionStorage.getItem(TOKEN_KEY)||"";next=safeNext(sessionStorage.getItem(NEXT_KEY)||"/")}
    }catch(_){ }
    history.replaceState(null,"",location.pathname);
    return {token:validToken(token)?token:"",cleaned:validToken(cleaned)?cleaned:"",next};
  }

  function cleanupDestination(token){
    const url=new URL(LEGACY_CLEANUP);url.hash=new URLSearchParams({proof:token}).toString();return url.href;
  }

  async function callApi(action,token,keepalive=false){
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);
    try{
      const response=await fetch(HANDOFF_URL,{
        method:"POST",mode:"cors",cache:"no-store",credentials:"omit",
        headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY},
        body:JSON.stringify({action,token}),signal:controller.signal,keepalive
      });
      const data=await response.json().catch(()=>null);
      if(!response.ok||!data)throw new Error(data&&data.error||"handoff_failed");
      return data;
    }finally{clearTimeout(timer)}
  }

  function validProfile(profile){
    return profile&&/^[A-Z0-9]{3,12}$/.test(String(profile.code||""))&&
      profile.viewer&&typeof profile.viewer.id==="string"&&profile.viewer.id.length<=200&&
      typeof profile.viewer.name==="string"&&profile.viewer.name.length<=200;
  }

  function applyPackage(pkg){
    if(!pkg||pkg.v!==1)throw new Error("invalid_package");
    const profiles=Array.isArray(pkg.profiles)?pkg.profiles.filter(validProfile).slice(0,12):[];
    const codes=new Set(profiles.map(profile=>profile.code));
    if(pkg.device){
      const device=String(pkg.device);
      if(device.length<8||device.length>128)throw new Error("invalid_device");
      localStorage.setItem("zad:device",device);
    }
    const mine=[];
    for(const profile of profiles){
      localStorage.setItem("zad:viewer:"+profile.code,JSON.stringify({id:profile.viewer.id,name:profile.viewer.name}));
      if(typeof profile.orgCode==="string"&&profile.orgCode) localStorage.setItem("zad:orgcode:"+profile.code,profile.orgCode.slice(0,200));
      mine.push({code:profile.code,name:profile.viewer.name,title:String(profile.title||"ختمة").slice(0,200),publicId:null,at:Date.now()});
    }
    if(mine.length)localStorage.setItem("zad:mine",JSON.stringify(mine));
    const active=codes.has(String(pkg.active||""))?String(pkg.active):profiles[0]?.code||"";
    if(active)localStorage.setItem("zad:last",active);
    if(pkg.prefs&&typeof pkg.prefs==="object"){
      for(const [key,value] of Object.entries(pkg.prefs)){
        if(SAFE_PREF_KEYS.has(key)&&typeof value==="string"&&value.length<=24000)localStorage.setItem(key,value);
      }
    }
    return {member:profiles.length>0,active};
  }

  function showSuccess(member,next){
    progress.hidden=true;failure.hidden=true;success.hidden=false;
    if(member){
      message.textContent="تم ربط هذا الجهاز بختمتك نفسها في النسخة النهائية من زاد الخير. يمكنك الآن فتح ختمتك. وإذا كان التطبيق القديم مثبتًا لديك، فيرجى حذفه وتثبيت التطبيق الجديد.";
      openApp.textContent="فتح زاد الخير";
    }else{
      message.textContent="أنت الآن في النسخة النهائية من زاد الخير. يمكنك فتح التطبيق ثم تثبيته على جهازك.";
      openApp.textContent="فتح زاد الخير";
    }
    openApp.href=safeNext(next);
    const install=new URL("../install/",location.href);install.searchParams.set("next",safeNext(next));installApp.href=install.href;
  }

  function showFailure(text){
    progress.hidden=true;success.hidden=true;failure.hidden=false;
    document.getElementById("failure-message").textContent=text||"لم تُحذف أو تتغير أي بيانات. تحقق من الاتصال ثم أعد المحاولة.";
  }

  const arrival=readArrival();
  async function run(){
    progress.hidden=false;success.hidden=true;failure.hidden=true;
    if(!arrival.token){
      try{
        const done=JSON.parse(localStorage.getItem(COMPLETE_KEY)||"null");
        if(done&&Date.now()-Number(done.at)<864e5){
          if(done.cleanup===true)return showSuccess(!!done.member,safeNext(done.next));
          if(arrival.cleaned&&sameValue(await tokenHash(arrival.cleaned),done.proof)){
            const completed={at:done.at,member:!!done.member,next:safeNext(done.next),cleanup:true};
            localStorage.setItem(COMPLETE_KEY,JSON.stringify(completed));
            sessionStorage.removeItem(CLEANUP_TOKEN_KEY);
            return showSuccess(completed.member,completed.next);
          }
          const retryToken=sessionStorage.getItem(CLEANUP_TOKEN_KEY)||"";
          if(validToken(retryToken)&&sameValue(await tokenHash(retryToken),done.proof)){
            location.replace(cleanupDestination(retryToken));return;
          }
          return showFailure("اكتمل نقل دخولك، لكن لم نتأكد من حذف ملفات النسخة القديمة. افتح الرابط القديم وأعد الانتقال لإكمال التنظيف.");
        }
      }catch(_){ }
      return showFailure("رابط الانتقال غير مكتمل. افتح الرابط القديم واضغط «الانتقال بأمان إلى النسخة النهائية» مرة أخرى.");
    }
    try{
      let pkg=null;
      try{pkg=JSON.parse(sessionStorage.getItem(PACKAGE_KEY)||"null")}catch(_){ }
      if(!pkg){
        const redeemed=await callApi("redeem",arrival.token);pkg=redeemed.payload;
        try{sessionStorage.setItem(PACKAGE_KEY,JSON.stringify(pkg))}catch(_){ }
      }
      const result=applyPackage(pkg);
      const proof=await tokenHash(arrival.token);
      localStorage.setItem(COMPLETE_KEY,JSON.stringify({at:Date.now(),member:result.member,next:arrival.next,cleanup:false,proof}));
      sessionStorage.setItem(CLEANUP_TOKEN_KEY,arrival.token);
      await callApi("confirm",arrival.token,true);
      sessionStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(NEXT_KEY);sessionStorage.removeItem(PACKAGE_KEY);
      location.replace(cleanupDestination(arrival.token));
    }catch(_){showFailure("لم تُحذف أو تتغير أي بيانات. تحقق من الاتصال ثم أعد المحاولة.")}
  }

  document.getElementById("retry").addEventListener("click",run);
  run();
})();
</script>
</body>
</html>
