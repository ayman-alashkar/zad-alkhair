/* ---------- Mushaf ---------- */
.reader{position:fixed;inset:0;background:var(--paper);overflow:hidden}
.track{
  position:absolute;left:0;top:0;width:60400vw;height:100%;
  display:flex;flex-direction:row-reverse;direction:ltr;
  will-change:transform;transition:transform .31s cubic-bezier(.2,.78,.2,1);
  touch-action:pan-y;
}
.page{
  flex:0 0 100vw;width:100vw;height:100%;direction:rtl;position:relative;
  background:var(--paper);color:var(--quran);overflow:hidden;
  padding:calc(18px + env(safe-area-inset-top)) 2px calc(18px + env(safe-area-inset-bottom));
}
.page-meta{
  position:relative;z-index:3;width:calc(100% - 24px);height:100%;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(12px + env(safe-area-inset-top)) 3px 0;
  color:var(--page-label);font-family:"Aref Ruqaa",serif;font-size:var(--page-label-size,24px);line-height:1.15;
}
.page-meta-link{
  appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0;margin:0;
  color:inherit;font:inherit;line-height:inherit;cursor:pointer;touch-action:manipulation;
  border-radius:7px;transition:color .16s ease,background .16s ease,transform .12s ease;
}
.page-meta-link:active{transform:scale(.96);color:var(--gold)}
.page-meta-link:focus-visible{outline:2px solid color-mix(in srgb,var(--gold) 55%,transparent);outline-offset:3px}
/* The ribbon stays in the top margin so it never covers Quran text. */
.page-bookmark{
  position:absolute;z-index:4;left:68px;top:env(safe-area-inset-top,0px);
  width:24px;height:34px;color:var(--red);pointer-events:none;
}
.page-bookmark svg{display:block;width:100%;height:100%;fill:currentColor}
.page-stage{
  --page-head:calc(43px + env(safe-area-inset-top));
  --page-foot:calc(34px + env(safe-area-inset-bottom));
  position:absolute;inset:0;
  display:grid;grid-template-rows:var(--page-head) minmax(0,1fr) var(--page-foot);
  justify-items:center;overflow:hidden;
}
.page-stage.special{align-items:center}
.page-stage.full{align-items:center;padding-top:0}
.page-footer{position:relative;width:100%;height:100%}
.mushaf{
  --mushaf-fit-width:0;
  width:min(99.2vw,780px);max-width:100%;height:100%;direction:rtl;
  display:flex;flex-direction:column;align-items:stretch;justify-content:center;
  transform-origin:center center;
}
/* A touch tablet can use its reading area beyond the desktop's 780px column.
   The page fitter still checks both dimensions, including after rotation. */
@media (min-width:600px) and (min-height:600px) and (hover:none) and (pointer:coarse){
  .mushaf{width:min(calc(100vw - 32px),1120px)}
  .page-stage{--page-label-size:26px}
}
/* A rotated phone or tablet reads at the available width, with vertical
   scrolling for the rest of the page. Portrait retains the approved fit. */
@media (orientation:landscape) and (hover:none) and (pointer:coarse){
  .mushaf{--mushaf-fit-width:1;width:calc(100vw - 32px)}
}
.line{
  width:100%;display:flex;justify-content:center;align-items:center;
  white-space:nowrap;overflow:visible;direction:rtl;line-height:1.33;
}
.line-inner{
  display:inline-flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;
  direction:rtl;white-space:nowrap;line-height:1.33;
  font-family:"QCF4_Hafs_01";font-weight:400;font-synthesis:none;
}
.surah-line{
  font-family:"QCF4_QBSML";color:var(--green);
  line-height:1.08;min-height:1.12em;margin-bottom:.12em;
  position:relative;overflow:visible;
}
/* QUL surah header is rendered to a cropped canvas overlay. The hidden
   QCF4 title underneath preserves the original Mushaf line box, so the
   decorative header can never change ayah size, spacing, or page fitting. */
.surah-line.banner-ready{width:100%;}
.surah-metric{
  font-family:"QCF4_QBSML";visibility:hidden;white-space:nowrap;
}
.surah-banner{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:block;width:min(94vw,735px);max-width:96%;height:auto;
  pointer-events:none;user-select:none;-webkit-user-select:none;opacity:.94;
}
/* Keep every Surah header in its original line box. Only Al-Fatiha gets a
   very small visual lift; this does not affect Mushaf fitting or line height. */
.page[data-page="1"] .surah-banner{
  transform:translate(-50%,-50%) translateY(-4px);
}
html[data-theme="dark"] .surah-banner{opacity:.88}
html[data-theme="dark"] .surah-line{color:#57b7a0}
/* Visual nudge only: move the Bismillah a little lower without changing

.bismillah-line{font-family:"QCF4_Hafs_01";line-height:1.25;margin:.04em 0 .12em;position:relative;color:var(--quran);transform:translateY(3px)}
.bismillah-original{display:inline}.bismillah-desktop{display:none}
.bismillah-original,.bismillah-desktop{-webkit-text-stroke:var(--quran-stroke) currentColor}
.verse-segment{
  display:inline-flex;direction:rtl;align-items:center;
  user-select:none;-webkit-user-select:none;touch-action:pan-y;
  border-radius:.18em;box-shadow:0 0 0 1px transparent inset;
  transition:background .13s,box-shadow .13s;
}
.verse-segment.selected{background:var(--select);box-shadow:0 0 0 1px var(--select-line) inset}
.word{
  display:inline-block;direction:rtl;color:var(--quran);

}

}
.loading{

}
.loading.hide{display:none}
.loading-error{display:grid;gap:12px;place-items:center;text-align:center;padding:24px;max-width:430px;line-height:1.8}
.loading-retry{border:1px solid var(--border);background:var(--brand);color:#fff;border-radius:12px;padding:9px 16px;font:600 12px Alexandria,system-ui,sans-serif}

/* ---------- Zād chrome ---------- */
.chrome{position:fixed;left:0;right:0;z-index:35;transition:opacity .18s,transform .18s}
.topbar{
  top:0;padding:calc(9px + env(safe-area-inset-top)) 13px 12px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,color-mix(in srgb,var(--chrome) 99%,transparent),color-mix(in srgb,var(--chrome) 90%,transparent),transparent);
}
.brand{font-family:"Aref Ruqaa",serif;font-size:29px;line-height:1;color:var(--chrome-text)}
.brand-home{text-decoration:none;cursor:pointer}
.top-actions{display:flex;gap:7px}
.iconbtn{
  width:42px;height:42px;border-radius:14px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--chrome-text) 6%,transparent);color:var(--chrome-text);
  display:grid;place-items:center;padding:0
}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zad-return-btn{direction:ltr}
.zad-return-btn svg{direction:ltr;transform:none!important;transform-origin:center}

.bottom{
  bottom:-1px;
  padding:4px 7px calc(4px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:46px minmax(0,1fr) minmax(0,1fr) 46px;
  grid-template-areas:"next listen tafsir prev" "shortcuts shortcuts shortcuts shortcuts";
  gap:6px;align-items:center;direction:ltr;
  /* Solid near the bottom, gently translucent toward the Mushaf. */
  background:linear-gradient(
    0deg,
    color-mix(in srgb,var(--chrome) 99%,transparent) 0%,
    color-mix(in srgb,var(--chrome) 96%,transparent) 58%,
    color-mix(in srgb,var(--chrome) 70%,transparent) 82%,
    color-mix(in srgb,var(--chrome) 22%,transparent) 100%
  );
  -webkit-backdrop-filter:blur(5px);
  backdrop-filter:blur(5px);
}
.tool,.navbtn{
  height:40px;min-width:0;border-radius:12px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--chrome-text) 6%,transparent);color:var(--chrome-text)
}

  display:flex;align-items:center;justify-content:center;gap:5px;padding:0 7px;font-size:10.25px;
  white-space:nowrap;overflow:hidden

/* ---------- Madinah-style collapsible audio ---------- */
.audio-fab{
  --audio-fab-size:54px;
  position:fixed;z-index:58;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  width:var(--audio-fab-size);height:var(--audio-fab-size);border:0;border-radius:50%;
  background:linear-gradient(145deg,#C59A4A,#9B702D);
  color:#FFF9EA;display:none;align-items:center;justify-content:center;
  box-shadow:0 10px 28px rgba(0,0,0,.28),0 0 0 7px color-mix(in srgb,var(--gold) 11%,transparent);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
}
/* CSS keeps the last position reachable after rotation, including safe areas. */
.audio-fab.is-positioned{
  right:auto;bottom:auto;
  left:clamp(calc(14px + env(safe-area-inset-left)),var(--audio-fab-x),calc(100% - var(--audio-fab-size) - 14px - env(safe-area-inset-right)));
  top:clamp(calc(14px + env(safe-area-inset-top)),var(--audio-fab-y),calc(100% - var(--audio-fab-size) - 14px - env(safe-area-inset-bottom)));
}
.audio-fab.is-dragging{cursor:grabbing}
body.player-on:not(.player-expanded) .audio-fab{display:flex}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave i{display:block;width:3px;border-radius:9px;background:currentColor;height:8px;opacity:.96}
body.audio-playing .wave i:nth-child(1){animation:wave .72s ease-in-out infinite}
body.audio-playing .wave i:nth-child(2){animation:wave .72s .12s ease-in-out infinite}
body.audio-playing .wave i:nth-child(3){animation:wave .72s .24s ease-in-out infinite}
body.audio-playing .wave i:nth-child(4){animation:wave .72s .36s ease-in-out infinite}
@keyframes wave{0%,100%{height:7px}50%{height:22px}}

.audio-panel{
  position:fixed;z-index:59;left:12px;right:12px;bottom:calc(9px + env(safe-area-inset-bottom));
  max-width:650px;margin:auto;display:none;
  background:color-mix(in srgb,var(--chrome) 98%,transparent);color:var(--chrome-text);
  border:1px solid var(--border);border-radius:28px;
  box-shadow:0 18px 50px var(--shadow);padding:22px 15px 14px;
  -webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);
}
body.player-on.player-expanded .audio-panel{display:block}
.audio-collapse{
  position:absolute;top:-20px;left:50%;transform:translateX(-50%);
  width:70px;height:35px;padding:0;border:1px solid var(--border);border-bottom:0;
  border-radius:22px 22px 0 0;background:color-mix(in srgb,var(--chrome) 98%,transparent);
  color:var(--chrome-text);display:grid;place-items:center;
  box-shadow:0 -5px 14px color-mix(in srgb,var(--shadow) 55%,transparent);
}
.audio-collapse svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.audio-collapse:active{background:color-mix(in srgb,var(--chrome-text) 9%,var(--chrome))}
.audio-top{
  display:grid;grid-template-columns:42px 42px minmax(0,1fr) 42px 42px;gap:7px;align-items:center
}
.audio-round{
  width:42px;height:42px;border:0;border-radius:50%;
  background:color-mix(in srgb,var(--chrome-text) 8%,transparent);color:var(--chrome-text);
  display:grid;place-items:center;padding:0
}
.audio-round svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.audio-qari{
  height:42px;min-width:0;border:1px solid var(--border);border-radius:999px;
  background:color-mix(in srgb,var(--chrome-text) 5%,transparent);color:var(--chrome-text);
  padding:0 14px;outline:none;text-align:right
}
.audio-now{
  margin:11px 2px 3px;font-size:10px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.audio-progress-row{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:8px;align-items:center;direction:rtl!important}
.audio-progress-time{font-size:9px;line-height:1;color:var(--ui-muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;direction:ltr;unicode-bidi:isolate}
.audio-progress{position:relative;height:22px;direction:rtl!important;display:flex;align-items:center}
.audio-progress:before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);border-radius:99px;background:color-mix(in srgb,var(--chrome-text) 13%,transparent)}
.audio-progress i{position:absolute;right:0;left:auto;top:50%;height:3px;width:0;transform:translateY(-50%);border-radius:99px;background:var(--gold-hi);pointer-events:none}
.audio-progress input[type="range"]{position:absolute;inset:0;width:100%;height:22px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;touch-action:none}
.audio-progress input[type="range"]::-webkit-slider-runnable-track{height:22px;background:transparent;border:0}
.audio-progress input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:4.5px;border-radius:50%;background:var(--gold-hi);border:2px solid var(--ui-surface);box-shadow:0 1px 5px rgba(0,0,0,.22)}
.audio-progress input[type="range"]::-moz-range-track{height:22px;background:transparent;border:0}
.audio-progress input[type="range"]::-moz-range-progress{background:transparent}
.audio-progress input[type="range"]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold-hi);border:2px solid var(--ui-surface);box-shadow:0 1px 5px rgba(0,0,0,.22)}
.audio-progress input[type="range"]:focus-visible{outline:2px solid color-mix(in srgb,var(--gold) 45%,transparent);outline-offset:3px;border-radius:999px}
.audio-controls{
  margin-top:13px;display:grid;grid-template-columns:52px 1fr 66px 1fr 48px 56px;gap:6px;align-items:center
}
.audio-control{
  height:48px;border:0;border-radius:50%;background:color-mix(in srgb,var(--chrome-text) 7%,transparent);
  color:var(--chrome-text);display:grid;place-items:center;padding:0
}
.audio-control svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.audio-main{
  width:62px;height:62px;justify-self:center;background:var(--gold);color:#fff;font-size:22px
}
.audio-pill{
  height:46px;border:0;border-radius:999px;background:color-mix(in srgb,var(--chrome-text) 6%,transparent);
  color:var(--chrome-text);font-size:10px;padding:0 9px;white-space:nowrap
}
.audio-repeat.active,.audio-continuous.active{box-shadow:0 0 0 1px var(--gold-hi) inset;color:var(--gold-hi);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.audio-continuous{font-size:8.5px;padding-inline:5px}
.audio-timer small{display:block;font-size:7px;margin-top:1px;opacity:.75}
@media(max-width:390px){
  .audio-panel{left:7px;right:7px;padding-inline:11px}
  .audio-top{grid-template-columns:39px 39px minmax(0,1fr) 39px 39px;gap:5px}
  .audio-round{width:39px;height:39px}
  .audio-controls{grid-template-columns:46px 1fr 58px 1fr 44px 52px;gap:4px}
  .audio-control{height:44px}.audio-main{width:58px;height:58px}
}

/* ---------- Sheets ---------- */
.backdrop{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{

.tafsir-nav-btn:active{background:var(--ui-accent-soft)}

.author-bio{font-family:Amiri,serif;font-size:18px;line-height:2;margin-top:12px}
.author-note{margin-top:13px;padding:10px 12px;border-radius:14px;background:#F3E9D6;color:#695E4C;font-size:11px;line-height:1.8}
.author-note a{color:inherit;text-decoration:underline;text-underline-offset:2px;unicode-bidi:isolate}
.bookmark-sections{display:grid;gap:16px;margin-top:12px}
.bookmark-section{display:grid;gap:8px}
.bookmark-section+.bookmark-section{padding-top:13px;border-top:1px solid #E5D6BA}
.bookmark-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bookmark-title h4{margin:0;font-family:"Aref Ruqaa",serif;font-size:21px;color:var(--green)}
.bookmark-title small{font-size:8px;color:#9A8B75}
.bookmark-list{display:grid;gap:8px}
.bookmark-row{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:7px;align-items:stretch}
.bookmark-row.recent{grid-template-columns:minmax(0,1fr)}
.bookmark-main,.bookmark-delete{border:1px solid #E6D5B7;background:#FFFAF1;color:#29493F;border-radius:14px}
.bookmark-main{padding:10px 12px;text-align:right;display:grid;gap:3px}
.bookmark-main b{font-family:"Aref Ruqaa",serif;font-size:20px}.bookmark-main small{font-size:9px;color:#8B7654}
.bookmark-main b.ayah-excerpt{font-family:Amiri,serif;font-size:19px;font-weight:700;line-height:1.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookmark-delete{display:grid;place-items:center;font-size:20px;color:#9A574E}

.menu-btn.wide{width:78px}
/* ---------- Full-screen Quran-style index ---------- */

.quran-index{
  --index-accent:var(--ui-accent);--index-accent-strong:var(--ui-accent);
  --index-dim:color-mix(in srgb,var(--ui-muted) 64%,transparent);
  --index-separator:color-mix(in srgb,var(--ui-gold) 7%,var(--paper));
  position:fixed;inset:0;z-index:105;background:var(--paper);color:var(--quran);
  display:flex;flex-direction:column;direction:rtl;
}
html[data-theme="dark"] .quran-index{--index-separator:color-mix(in srgb,var(--ui-gold) 8%,var(--paper))}
.quran-index-head{
  flex:0 0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 9px;min-height:62px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--ui-line);background:color-mix(in srgb,var(--paper) 96%,var(--ui-surface-2));
}
.quran-index-title{font-family:"Aref Ruqaa",serif;font-size:27px;line-height:1;color:var(--chrome-text)}
.quran-index-tabs{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ui-line);background:color-mix(in srgb,var(--paper) 97%,var(--ui-surface-2))}

.quran-index-tab{height:46px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.quran-index-tab.active{color:var(--index-accent-strong)}
.quran-index-tab.active:after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--ui-gold)}
.quran-index-scroll{flex:1 1 auto;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(14px + env(safe-area-inset-bottom));scrollbar-width:none;touch-action:pan-y}
.quran-index-scroll::-webkit-scrollbar{display:none}
/* No scroll bars on panels and lists, on phone or computer (as on home). A
   scrolling Mushaf page keeps its bar as a sign that the page continues. */
:not(.page-stage){scrollbar-width:none}
:not(.page-stage)::-webkit-scrollbar{display:none}
.quran-index-row{width:100%;min-height:78px;border:0;background:transparent;color:var(--quran);padding:9px 22px 9px 21px;display:grid;grid-template-columns:44px minmax(0,1fr) 48px;gap:11px;align-items:center;text-align:right}
.quran-index-row:active{background:var(--ui-accent-soft)}
.quran-index-row.current{background:linear-gradient(90deg,transparent,var(--ui-accent-soft),transparent)}
.quran-index-surah-num{font-family:"Aref Ruqaa",serif;font-size:20px;color:var(--muted);text-align:center}
.quran-index-main{min-width:0;display:grid;gap:2px}
.quran-index-name{font-family:"Aref Ruqaa",serif;font-size:22px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quran-index-meta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quran-index-page{font-family:"Aref Ruqaa",serif;font-size:16px;color:var(--muted);text-align:left;direction:rtl}
.quran-index-row.current .quran-index-name,.quran-index-row.current .quran-index-surah-num{color:var(--index-accent-strong)}
.quran-index-juz-sep{min-height:51px;padding:0 23px 0 22px;background:var(--index-separator);color:var(--muted);display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:11px;align-items:center;border-block:1px solid color-mix(in srgb,var(--ui-gold) 10%,transparent)}
.quran-index-juz-sep b{font-family:"Aref Ruqaa",serif;font-size:19px;font-weight:400;text-align:right;color:color-mix(in srgb,var(--chrome-text) 78%,var(--muted))}
.quran-index-juz-sep span{font-family:"Aref Ruqaa",serif;font-size:16px;text-align:left}
.quran-index-quarter-row{grid-template-columns:52px minmax(0,1fr) 48px;min-height:90px}
.hizb-ring{--portion:0%;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;background:conic-gradient(from 0deg,color-mix(in srgb,var(--ui-accent) 62%,var(--paper)) 0 var(--portion),color-mix(in srgb,var(--ui-muted) 52%,var(--paper)) var(--portion) 100%);color:var(--ui-text);font-family:"Aref Ruqaa",serif;font-size:14px}
html[data-theme="dark"] .hizb-ring{color:#14201D}
.hizb-ring.start{background:color-mix(in srgb,var(--ui-accent) 72%,var(--paper))}
.hizb-ring.q1{--portion:25%}.hizb-ring.q2{--portion:50%}.hizb-ring.q3{--portion:75%}
.hizb-ring:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ui-accent) 34%,transparent);pointer-events:none}
.quran-index-quarter-title{font-family:Amiri,serif;font-size:18px;line-height:1.45;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:390px){
  .quran-index-row{padding-inline:14px 15px;grid-template-columns:38px minmax(0,1fr) 42px;gap:8px;min-height:73px}
  .quran-index-quarter-row{grid-template-columns:47px minmax(0,1fr) 42px;min-height:84px}
  .hizb-ring{width:44px;height:44px;font-size:13px}.quran-index-name{font-size:20px}.quran-index-quarter-title{font-size:17px}
  .quran-index-juz-sep{padding-inline:17px;grid-template-columns:minmax(0,1fr) 45px;min-height:48px}
}

/* ---------- index · smooth two-pane + collapsible Juz ---------- */
.quran-index-viewport{flex:1 1 auto;min-height:0;overflow:hidden;position:relative;touch-action:pan-y;direction:ltr}
.quran-index-track{
  width:200%;height:100%;display:flex;direction:ltr;will-change:transform;
  transform:translate3d(-50%,0,0);
  transition:transform .26s cubic-bezier(.22,.72,.24,1);
}
.quran-index-pane{width:50%;height:100%;min-width:0;direction:rtl;overflow:hidden}

.juz-accordion-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s cubic-bezier(.2,.72,.24,1)}
.juz-accordion.open .juz-accordion-body{grid-template-rows:1fr}
.juz-accordion-body-inner{min-height:0;overflow:hidden;background:color-mix(in srgb,var(--ui-surface) 56%,transparent)}

.juz-accordion .hizb-ring{width:40px;height:40px;font-size:12px}
.juz-accordion .quran-index-quarter-row{grid-template-columns:44px minmax(0,1fr) 42px}

/* ---------- v36 · desktop experience ----------
   Desktop gets its own interaction geometry while the approved mobile layout stays intact. */
@media (min-width:900px){
  .topbar{
    padding:18px 28px 34px;
  }
  .brand{font-size:33px}
  .top-actions{gap:10px}
  .iconbtn{
    width:46px;height:46px;border-radius:14px;
    transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;
  }
  .iconbtn:hover,.tool:hover,.navbtn:hover,.audio-round:hover,.audio-control:hover,.audio-pill:hover{
    transform:translateY(-1px);
    border-color:color-mix(in srgb,var(--gold) 42%,var(--ui-line));
    background:color-mix(in srgb,var(--ui-gold) 8%,var(--ui-surface));
    box-shadow:0 10px 24px -20px rgba(39,45,39,.58);
  }
  html[data-theme="dark"] .iconbtn:hover,
  html[data-theme="dark"] .tool:hover,
  html[data-theme="dark"] .navbtn:hover,
  html[data-theme="dark"] .audio-round:hover,
  html[data-theme="dark"] .audio-control:hover,
  html[data-theme="dark"] .audio-pill:hover{
    background:rgba(228,201,128,.085);
    border-color:rgba(228,201,128,.30)
  }
  .iconbtn:focus-visible,.tool:focus-visible,.navbtn:focus-visible,
  .audio-round:focus-visible,.audio-control:focus-visible,.audio-pill:focus-visible,
  .audio-qari:focus-visible{
    outline:3px solid color-mix(in srgb,var(--gold) 34%,transparent);
    outline-offset:3px;
  }

  /* Compact central command dock. Page navigation moves to the two Mushaf sides. */
  .bottom{
    left:50%;right:auto;bottom:18px;
    width:min(520px,calc(100vw - 300px));
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-areas:"listen tafsir" "shortcuts shortcuts";
    gap:8px;padding:8px;
    border:1px solid color-mix(in srgb,var(--gold) 19%,var(--ui-line));
    border-radius:20px;
    transform:translateX(-50%);
    background:color-mix(in srgb,var(--ui-surface) 94%,transparent);
    box-shadow:0 18px 44px -28px rgba(28,31,28,.52);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  }
  .hidden-tools .bottom{transform:translate(-50%,14px)}
  .tool{height:48px;font-size:12px;border-radius:14px;gap:7px}
  .tool svg{width:19px;height:19px;flex-basis:19px}

  .bottom>.navbtn{display:none}
  .desktop-page-nav{
    position:fixed;z-index:37;left:50%;top:50%;
    width:min(1040px,calc(100vw - 48px));
    transform:translate(-50%,-50%);
    display:flex;justify-content:space-between;align-items:center;
    pointer-events:none;direction:ltr;
    transition:opacity .18s ease;
  }
  .desktop-page-btn{
    width:56px;height:82px;flex:0 0 56px;
    border:1px solid var(--ui-line);border-radius:20px;pointer-events:auto;
    display:grid;place-items:center;padding:0;color:var(--brand);
    background:color-mix(in srgb,var(--ui-surface) 84%,transparent);
    box-shadow:0 14px 38px -27px rgba(20,28,24,.64);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    transition:transform .16s ease,background .16s ease,border-color .16s ease,opacity .16s ease;
  }
  .desktop-page-btn svg{
    width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round
  }
  .desktop-page-btn:hover{
    transform:scale(1.035);
    border-color:color-mix(in srgb,var(--gold) 42%,var(--ui-line));
    background:color-mix(in srgb,var(--ui-gold) 8%,var(--ui-surface))
  }
  .desktop-page-btn:focus-visible{
    outline:3px solid color-mix(in srgb,var(--gold) 34%,transparent);outline-offset:4px
  }
  .desktop-page-btn:disabled{opacity:.20;cursor:default}
  html[data-theme="dark"] .desktop-page-btn{
    color:rgba(255,249,234,.84);background:rgba(8,45,41,.72);
    border-color:rgba(228,201,128,.18)
  }
  html[data-theme="dark"] .desktop-page-btn:hover{
    background:rgba(228,201,128,.08);border-color:rgba(228,201,128,.32)
  }
  .hidden-tools .desktop-page-nav{opacity:0;pointer-events:none}
  .hidden-tools .desktop-page-btn{pointer-events:none}

  /* Desktop player: information and reciter on one side, transport controls on the other. */
  .audio-panel{
    left:50%;right:auto;bottom:22px;
    width:min(900px,calc(100vw - 120px));max-width:none;
    transform:translateX(-50%);
    padding:23px 24px 18px;border-radius:24px;
  }
  body.player-on.player-expanded .audio-panel{
    display:grid;
    grid-template-columns:minmax(300px,.92fr) minmax(430px,1.25fr);
    grid-template-rows:auto auto auto;
    column-gap:28px;row-gap:8px;align-items:center;
  }
  .audio-collapse{top:-19px}
  .audio-top{
    grid-column:1;grid-row:1;
    grid-template-columns:46px 46px minmax(0,1fr) 46px 46px;gap:8px;
  }
  .audio-round{width:46px;height:46px}
  .audio-qari{
    height:46px;border-radius:14px;padding-inline:15px;
    font-size:12.5px;font-weight:500;
    cursor:pointer;
  }
  .audio-now{
    grid-column:1;grid-row:2;
    margin:3px 3px 1px;font-size:11.5px;line-height:1.6;
  }
  .audio-progress-row{
    grid-column:1/-1;grid-row:3;margin-top:5px;
  }
  .audio-progress:before,.audio-progress i{height:4px}
  .audio-controls{
    grid-column:2;grid-row:1/3;
    margin:0;display:grid;
    grid-template-columns:72px 58px 74px 58px 58px 78px;
    justify-content:center;gap:10px;
  }
  .audio-control{width:54px;height:54px;justify-self:center}
  .audio-main{width:68px;height:68px;font-size:24px}
  .audio-pill{height:48px;font-size:11px;padding-inline:12px}
  .audio-continuous{font-size:10px}

  /* Desktop dialogs become centered panels rather than phone bottom-sheets. */
  .backdrop{align-items:center;padding:28px}
  .sheet{
    width:min(760px,calc(100vw - 80px));max-height:min(780px,86vh);
    border-radius:26px;padding:20px 22px 22px;
    box-shadow:0 28px 80px -36px rgba(0,0,0,.52)
  }
  .sheethead h3{font-size:29px}
  .field select{min-height:48px;font-size:13px}
  .apply{min-height:50px;font-size:13px}

  /* Mouse affordance for clickable Mushaf metadata. */
  .page-meta-link:hover{
    color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent)
  }
}
@media (min-width:900px) and (max-width:1120px){
  .desktop-page-nav{width:calc(100vw - 30px)}
  .audio-panel{width:min(820px,calc(100vw - 70px))}
  body.player-on.player-expanded .audio-panel{
    grid-template-columns:minmax(280px,.85fr) minmax(390px,1.15fr);
    column-gap:18px
  }
  .audio-controls{gap:7px;grid-template-columns:66px 54px 70px 54px 54px 72px}
}

/* Touch readers turn pages by swiping; the two tool rows use the full dock. */
@media (hover:none) and (pointer:coarse){
  .bottom{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"listen tafsir" "shortcuts shortcuts"}
  .bottom>.navbtn,.desktop-page-nav{display:none}
}
/* A rotated phone has little height: the four tools share one row, in the
   same right-to-left order as the two portrait rows. */
@media (orientation:landscape) and (max-height:599px) and (hover:none) and (pointer:coarse){
  .bottom{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:"shortcuts shortcuts listen tafsir"}
}
/* Larger touch screens get readable controls in either orientation. The
   short-side bounds keep ordinary phones and mouse-driven computers intact. */
@media (min-width:600px) and (min-height:600px) and (hover:none) and (pointer:coarse){
  .bottom{
    --tablet-tool-height:clamp(56px,6vmin,64px);
    --tablet-tool-icon:clamp(22px,2.4vmin,26px);
    gap:clamp(8px,1vmin,10px);
  }
  .bottom .tool{
    height:var(--tablet-tool-height);min-height:var(--tablet-tool-height);
    font-size:clamp(14px,1.5vmin,16px);border-radius:clamp(14px,1.6vmin,17px);
    gap:clamp(7px,.8vmin,10px);padding-inline:clamp(12px,1.5vmin,18px);
  }
  .bottom .tool svg{
    width:var(--tablet-tool-icon);height:var(--tablet-tool-icon);flex-basis:var(--tablet-tool-icon);
  }
  .bottom #listenBtn>span:first-child{font-size:var(--tablet-tool-icon);line-height:1}
}
@media (min-width:900px) and (min-height:600px) and (hover:none) and (pointer:coarse){
  .bottom{width:min(680px,calc(100vw - 80px))}
}

/* ---------- v37 · native reciter menu contrast ----------
   Native option popups are painted by the browser/OS, so give the option
   surface explicit colors instead of inheriting the player's night palette. */
.audio-qari{color-scheme:light}
.audio-qari option{
  background:#FFFCF4 !important;
  color:#132823 !important;
}
html[data-theme="dark"] .audio-qari{color-scheme:dark}
html[data-theme="dark"] .audio-qari option{
  background:#0D3C35 !important;
  color:#FFF9EA !important;
}

/* ---------- v42 · true glass player ----------
   Strongly transparent in light mode; controls keep a light veil
   for readability while the Mushaf remains clearly visible below. */
.audio-panel{
  background:rgba(255,252,244,.26) !important;
  -webkit-backdrop-filter:blur(22px) saturate(112%);
  backdrop-filter:blur(22px) saturate(112%);
  border-color:rgba(197,154,74,.18);
  box-shadow:0 18px 46px rgba(19,40,35,.13);
}
.audio-collapse,
.audio-round,
.audio-pill,
.audio-qari,
.audio-control:not(.audio-main){
  background:rgba(255,252,244,.36) !important;
  border-color:rgba(114,76,43,.13);
}
html[data-theme="dark"] .audio-panel{
  background:rgba(8,45,41,.56) !important;
  border-color:rgba(228,201,128,.16);
  box-shadow:0 18px 48px rgba(0,0,0,.25);
}
html[data-theme="dark"] .audio-collapse,
html[data-theme="dark"] .audio-round,
html[data-theme="dark"] .audio-pill,
html[data-theme="dark"] .audio-qari,
html[data-theme="dark"] .audio-control:not(.audio-main){
  background:rgba(255,249,234,.055) !important;
  border-color:rgba(228,201,128,.15);
}
@media (min-width:900px){
  .audio-panel{
    -webkit-backdrop-filter:blur(24px) saturate(114%);
    backdrop-filter:blur(24px) saturate(114%);
  }
}

   gold = spiritual/primary, green = active state, ink = everyday chrome.
   Mushaf composition, QCF metrics and all dark-mode contracts stay untouched.

}

   Gold remains reserved for playback itself. */

}
html:not([data-theme="dark"]) .audio-collapse,
html:not([data-theme="dark"]) .audio-round,
html:not([data-theme="dark"]) .audio-pill,

}

/* Sheets follow the actual app: headings are ink, links/actions may carry green. */

/* ---------- Full verified tafsir ---------- */
.tafsir-fadl{
  margin-top:12px;border:1px solid color-mix(in srgb,var(--ui-gold) 22%,transparent);
  border-radius:14px;background:color-mix(in srgb,var(--ui-gold) 6%,var(--ui-surface));
  overflow:hidden

.tafsir-fadl[open] summary::before{transform:rotate(-90deg)}

/* ---------- v78 · اكتمال الصفحة على أيّ شاشة ----------
   نموذج قراءة واحد لكل الأجهزة: الصفحة تُلاءم عرضًا وارتفاعًا معًا، فتبقى
   صفحةً كاملة كما في المصحف. أفقي اللمس يستفيد من العرض والتمرير، وتختار
   fitPage() المقياس المناسب لكل حالة.

   تُضاف .scrolls إلى صفحةٍ بعينها عند القراءة بعرض الشاشة في أفقي اللمس،
   أو حين تعجز عن الاكتمال بحجم مقروء. وتُنزع عنها متى عادت ملاءمة الصفحة
   كاملةً. لا تمسّ هذه الحالة أي صفحة أخرى. */
.page-stage.scrolls{
  display:block;
  overflow-x:hidden;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:color-mix(in srgb,var(--gold) 28%,transparent) transparent;
}
.page-stage.scrolls::-webkit-scrollbar{width:7px}
.page-stage.scrolls::-webkit-scrollbar-track{background:transparent}
.page-stage.scrolls::-webkit-scrollbar-thumb{
  background:color-mix(in srgb,var(--gold) 24%,transparent);
  border-radius:999px
}
/* بلا height:auto لا ينمو المصحف، فلا يجد المسرحُ ما يمرّره. */
.page-stage.scrolls .mushaf{
  height:auto;
  min-height:calc(100% - var(--page-head) - var(--page-foot));
  margin-inline:auto;
  padding-block:10px 26px;
}
.page-stage.scrolls>.page-meta{height:var(--page-head);margin-inline:auto}
.page-stage.scrolls>.page-footer{height:var(--page-foot)}

/* بسملة الحاسب: استبدال محرف أُقرّ سابقًا، لا علاقة له بتخطيط الصفحة،
   فيبقى على معياره كما هو.

   والمسافة حول البسملة تُقارَب هنا قليلًا: أكثرها فراغٌ داخل صندوق السطر
   لا هامشٌ بينه وبين ما جاوره، فيُقلَّص من الاثنين معًا. ولا يمسّ هذا صفحةً
   بلا عنوان سورة، لأن البسملة لا ترد إلا مع مطلع سورة. */
@media (hover:hover) and (pointer:fine){
  .bismillah-line{
    transform:none;
    line-height:1.14;
    margin:0 0 5px;
  }
  .surah-line{margin-bottom:.04em}
  .bismillah-original{display:none}
  .bismillah-desktop{display:inline}
}

/* First-time offline preparation: visible progress, then disappear. */
.quran-offline-setup{
  position:fixed;
  z-index:176;
  top:calc(76px + env(safe-area-inset-top));
  left:50%;
  width:min(430px,calc(100% - 24px));
  transform:translate(-50%,-10px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  direction:rtl;
  transition:opacity .2s ease,transform .2s ease,visibility .2s step-end;
}
.quran-offline-setup.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
  transition:opacity .2s ease,transform .2s ease,visibility 0s;
}
.quran-offline-card{
  border:1px solid color-mix(in srgb,var(--gold) 34%,var(--ui-line));
  border-radius:18px;
  background:
    radial-gradient(circle at 92% 0%,color-mix(in srgb,var(--gold) 9%,transparent),transparent 38%),
    color-mix(in srgb,var(--ui-surface) 96%,var(--paper));
  box-shadow:0 14px 38px -23px rgba(4,36,31,.56);
  padding:12px 13px 11px;
}
.quran-offline-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.quran-offline-title{
  min-width:0;
  color:var(--brand-strong);
  font:700 11px Alexandria,system-ui,sans-serif;
  line-height:1.65;
}
.quran-offline-percent{
  flex:0 0 auto;
  min-width:43px;
  color:var(--brand);
  font:700 13px "Aref Ruqaa",serif;
  text-align:left;
  direction:rtl;
}
.quran-offline-track{
  height:7px;
  margin-top:9px;
  overflow:hidden;
  border-radius:999px;
  background:color-mix(in srgb,var(--brand) 10%,var(--ui-surface-3));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 10%,transparent);
}
.quran-offline-fill{
  display:block;
  width:0%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--gold),var(--brand));
  transition:width .22s ease;
}
html[data-theme="dark"] .quran-offline-card{
  background:
    radial-gradient(circle at 92% 0%,rgba(228,201,128,.08),transparent 38%),

  color:var(--brand-strong);

}
.close-sheet:active,
.quran-options-sheet .close-sheet:active{
  background:color-mix(in srgb,var(--brand) 10%,var(--ui-surface-2));

/* One card language for options, reciters, downloads and ordinary selectors. */
.audio-qari-choice,
.audio-offline-checkrow,
.audio-offline-actions button,
.quran-hub-menu button,
.tafsir-nav-btn,
.field select,
.quran-search-input{
  border-color:color-mix(in srgb,var(--gold) 22%,var(--ui-line));
  background:color-mix(in srgb,var(--brand) 2.5%,var(--ui-surface-2));
  color:var(--brand-strong);
  box-shadow:none;
}
.audio-qari-choice,
.audio-offline-checkrow,
.audio-offline-actions button{
  border-radius:14px;
  font-weight:600;
}
.audio-qari-choice:active,
.audio-offline-checkrow:active,
.audio-offline-actions button:active,
.quran-hub-menu button:active,
.tafsir-nav-btn:active{
  background:color-mix(in srgb,var(--brand) 8%,var(--ui-surface-2));
  border-color:color-mix(in srgb,var(--gold) 42%,var(--ui-line));
}
.audio-qari-choice.downloaded,
.audio-offline-checkrow.select-all{

}

  font-weight:600;
}
.audio-qari-choice small,
.audio-offline-message small,
.quran-hub-menu button small,
.field label{

}
.audio-offline-more{
  color:var(--brand);
  font-weight:600;
}
.audio-offline-actions .delete{
  color:#7A5A25;
  background:color-mix(in srgb,var(--gold) 8%,var(--ui-surface));
  border-color:color-mix(in srgb,var(--gold) 38%,var(--ui-line));
}

/* Bring the previously bespoke Options sheet back into the same system. */
.quran-options-sheet .sheethead{padding:15px 16px 12px}
.quran-options-sheet .sheethead:after{right:16px;width:52px;height:1.5px}
.quran-options-sheet .sheethead h3{font-size:27px}
.quran-options-intro{
  padding:10px 16px 0;

  font-weight:500;
}
.quran-options-intro:before{width:20px;height:1px;box-shadow:none;background:var(--gold)}
.quran-hub-menu{gap:8px;margin:9px 12px 4px}
.quran-hub-menu button{
  min-height:60px;
  border-radius:15px;
  padding:8px 10px;
  grid-template-columns:42px minmax(0,1fr) 17px;
  gap:10px;
  background:color-mix(in srgb,var(--brand) 2.5%,var(--ui-surface-2));
}
.quran-option-icon{
  width:40px;height:40px;border-radius:12px;
  color:var(--brand);

  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 17%,transparent);
}
.quran-option-icon.gold{
  color:#916A25;
  background:color-mix(in srgb,var(--gold) 9%,var(--ui-surface));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 22%,transparent);
}
.quran-option-copy strong{color:var(--brand-strong);font-weight:600}
.quran-option-arrow{color:var(--gold)}

/* Native reciter/select controls: same identity even where the OS renders the popup. */
html:not([data-theme="dark"]) .audio-qari,
html:not([data-theme="dark"]) .field select{
  color:var(--brand-strong);

}

}

html[data-theme="dark"] .audio-qari-choice,
html[data-theme="dark"] .audio-offline-checkrow,
html[data-theme="dark"] .audio-offline-actions button,
html[data-theme="dark"] .quran-hub-menu button,
html[data-theme="dark"] .tafsir-nav-btn,
html[data-theme="dark"] .field select,

html[data-theme="dark"] .audio-offline-checkrow:active,

html[data-theme="dark"] .audio-qari-choice.downloaded,
html[data-theme="dark"] .audio-offline-checkrow.select-all{background:rgba(228,201,128,.07);border-color:rgba(228,201,128,.30)}
html[data-theme="dark"] .audio-offline-prompt{color:var(--ivory) !important}
html[data-theme="dark"] .audio-qari-choice small,
html[data-theme="dark"] .audio-offline-message small,
html[data-theme="dark"] .quran-hub-menu button small,
html[data-theme="dark"] .field label{color:rgba(255,249,234,.62)}
html[data-theme="dark"] .quran-option-copy strong{color:var(--ivory)}
html[data-theme="dark"] .quran-index-head-action{color:var(--ivory)}

/* Player transport and readable reciter name. Native select stays accessible. */
.audio-qari-wrap{position:relative;flex:1;min-width:0;overflow:hidden;height:38px;border-radius:10px;background:var(--brand-soft,rgba(15,92,80,.08))}
.audio-qari-wrap .audio-qari{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.qari-marquee{position:absolute;inset:0 10px;overflow:hidden;display:flex;align-items:center;direction:rtl;pointer-events:none}
.qari-marquee span{display:block;flex-shrink:0;white-space:nowrap;font-size:12px}
.qari-marquee.moving span{animation:qari-scroll var(--qari-duration,14s) ease-in-out infinite}
@keyframes qari-scroll{0%,15%{transform:translateX(0)}75%,90%{transform:translateX(var(--qari-distance))}100%{transform:translateX(0)}}
.audio-qari-wrap:focus-within{outline:2px solid var(--brand);outline-offset:2px}
.audio-repeat{position:relative}.audio-repeat small{position:absolute;bottom:1px;inset-inline-end:2px;font-size:10px;line-height:1}
.audio-panel{--player-accent:#082D29;--player-on-accent:#FFF9EA}

.audio-panel .audio-qari-wrap,
.audio-panel #continuousBtn,
html:not([data-theme="dark"]) .audio-panel #continuousBtn.active,
html[data-theme="dark"] .audio-panel #continuousBtn.active{
  background:var(--player-accent)!important;color:var(--player-on-accent)!important;border-color:var(--player-accent)!important;box-shadow:none;
}
.audio-panel #continuousBtn{font-weight:600}
.audio-panel #continuousBtn.active{outline:1px solid var(--player-accent);outline-offset:3px}
.audio-qari-wrap:focus-within{outline-color:var(--player-accent)}
.audio-now-row{display:flex;align-items:center;gap:12px;margin:9px 2px 3px;min-width:0}
.audio-now-row .audio-now{flex:1;min-width:0;margin:0}
.audio-queue-link{position:relative;flex:0 0 34px;display:grid;place-items:center;width:34px;height:32px;border:0;border-radius:10px;background:transparent;color:var(--ui-muted);cursor:pointer;padding:5px}
.audio-queue-link:hover,.audio-queue-link:focus-visible{color:var(--player-accent);background:color-mix(in srgb,var(--player-accent) 8%,transparent)}
.audio-queue-link svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.audio-queue-link span{position:absolute;top:-3px;inset-inline-end:-3px;min-width:14px;height:14px;box-sizing:border-box;display:grid;place-items:center;background:var(--player-accent);color:var(--player-on-accent);border-radius:8px;padding:0 3px;font-size:8px;line-height:1}
.audio-queue-link span:empty{display:none}
@media(min-width:900px){.audio-now-row{grid-column:1;grid-row:2;margin:0}}
.queue-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-block:12px}
.queue-toolbar button,.queue-actions button{font:inherit;border:1px solid #8885;border-radius:9px;background:transparent;color:inherit;padding:8px;cursor:pointer}
.queue-list{display:grid;gap:8px;max-height:42vh;overflow:auto;padding:0;list-style:none;touch-action:pan-y}
.queue-row{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #8884;border-radius:12px}
.queue-row.current{border-color:var(--brand,#0f5c50);background:var(--brand-soft,rgba(15,92,80,.08))}
.queue-track{flex:1;min-width:0;text-align:right;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.queue-track small{display:block;opacity:.65;font-size:11px;margin-top:4px}
.queue-actions{display:flex;gap:4px}.queue-actions button{padding:7px;min-width:32px}.queue-actions button:disabled{opacity:.3;cursor:default}
.queue-handle{cursor:grab;touch-action:none;padding:8px;color:inherit;background:none;border:0;font-size:20px}
.queue-row.dragging{opacity:.55}.queue-empty,.player-hint{font-size:12px;line-height:1.9;opacity:.75}
.timer-digits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;direction:ltr;margin:18px 0}
.timer-column{text-align:center;min-width:0}.timer-column-title{font-size:12px;color:var(--ui-muted);margin-bottom:6px}
.timer-wheel-wrap{position:relative;border:1px solid var(--ui-line);border-radius:15px;overflow:hidden;background:var(--ui-surface-2)}
.timer-wheel-wrap:before{content:"";position:absolute;z-index:1;inset:44px 5px;border-block:1px solid color-mix(in srgb,var(--brand) 28%,transparent);border-radius:9px;background:color-mix(in srgb,var(--brand) 8%,transparent);pointer-events:none}
.timer-wheel{height:132px;box-sizing:border-box;overflow-y:auto;padding-block:44px;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;position:relative;z-index:2}
.timer-wheel::-webkit-scrollbar{display:none}
.timer-value{height:44px;width:100%;display:block;flex-shrink:0;scroll-snap-align:center;border:0;padding:0;background:transparent;color:var(--ui-muted);font:500 24px Alexandria,system-ui,sans-serif;font-variant-numeric:tabular-nums;cursor:pointer;opacity:.55}
.timer-value[aria-selected="true"]{color:#082D29;font-weight:700;opacity:1}
html[data-theme="dark"] .timer-value[aria-selected="true"]{color:#E4C980}
html[data-theme="dark"] .timer-wheel-wrap:before{border-color:rgba(228,201,128,.3);background:rgba(228,201,128,.08)}
.timer-nudge{display:block;width:100%;height:30px;padding:0;border:0;background:transparent;color:var(--ui-muted);font-size:20px;cursor:pointer}
.timer-nudge:focus-visible,.timer-value:focus-visible{outline:2px solid var(--ui-gold);outline-offset:-3px;border-radius:8px}
.timer-presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.timer-presets button{flex:1;font:inherit;border:1px solid #8885;border-radius:10px;padding:9px;background:transparent;color:inherit;cursor:pointer}
@media(prefers-reduced-motion:reduce){.qari-marquee.moving span{animation:none}.qari-marquee{overflow:auto;pointer-events:auto}}

/* One ivory, emerald and brushed-gold surface system for the reader, player and every sheet. */
:root{
  color-scheme:light;
  --reader-surface:rgba(255,251,242,.94);--reader-raised:rgba(255,254,249,.78);
  --reader-well:rgba(230,216,184,.22);--reader-ink:#173E35;--reader-muted:#746C57;
  --reader-line:rgba(169,131,58,.30);--reader-gold:#96702D;
  --reader-selected:rgba(213,178,101,.18);--reader-shadow:rgba(69,52,21,.17);
  --reader-action:linear-gradient(135deg,#F1DFA8 0%,#D5B16A 60%,#C69B4B 100%);
  --reader-on-action:#253B2F;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --reader-surface:rgba(8,38,33,.95);--reader-raised:rgba(255,246,217,.045);
  --reader-well:rgba(0,0,0,.12);--reader-ink:#FFF5DC;--reader-muted:#C1BBA7;
  --reader-line:rgba(228,201,128,.23);--reader-gold:#E4C980;
  --reader-selected:rgba(228,201,128,.11);--reader-shadow:rgba(0,0,0,.34);
  --reader-action:linear-gradient(135deg,#F4E4B2 0%,#E4C980 65%,#C9A355 100%);
}
html #audioPanel{
  width:min(560px,calc(100vw - 24px));max-width:560px;left:50%;right:auto;transform:translateX(-50%);
  bottom:calc(12px + env(safe-area-inset-bottom));padding:20px 18px 16px;border-radius:26px;
  background:radial-gradient(ellipse at 50% 0%,rgba(228,201,128,.10),transparent 70%),var(--reader-surface)!important;
  color:var(--reader-ink);border:1px solid var(--reader-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 14px 48px -12px var(--reader-shadow);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
html body.player-on.player-expanded #audioPanel{display:block}
body.player-on.player-expanded .bottom{opacity:0;visibility:hidden;pointer-events:none}
#audioPanel .audio-top{display:grid;grid-template-columns:40px 40px minmax(0,1fr) 40px 40px;gap:7px}
#audioPanel .audio-round{width:40px;height:40px}
#audioPanel .audio-round,#audioPanel .audio-control:not(.audio-main),#audioPanel .audio-pill,#audioPanel .audio-qari-wrap{
  background:var(--reader-raised)!important;color:var(--reader-gold)!important;
  border:1px solid var(--reader-line);border-color:var(--reader-line)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
#audioPanel .audio-qari-wrap{height:40px;border-radius:12px;color:var(--reader-ink)!important}
#audioPanel .qari-marquee{inset-inline:12px}
#audioPanel .qari-marquee span{font-size:11px;font-weight:500}
#audioPanel .audio-timer small{color:var(--reader-muted);opacity:1;font-size:8px}
#audioPanel .audio-collapse{width:54px;height:28px;top:-16px;border-radius:17px 17px 0 0;background:var(--reader-surface)!important;color:var(--reader-gold);border-color:var(--reader-line);box-shadow:none}
#audioPanel .audio-collapse svg{width:18px;height:18px}
#audioPanel .audio-now-row{position:relative;display:flex;align-items:center;justify-content:center;min-height:70px;margin:13px 0 9px;padding-inline:96px}
#audioPanel .audio-now-copy{min-width:0;text-align:center;display:grid;gap:5px}
#audioPanel .audio-eyebrow{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--reader-gold);font-size:9px;font-weight:500;line-height:1.4}
#audioPanel .audio-eyebrow:before,#audioPanel .audio-eyebrow:after{content:"";height:1px;width:24px;background:var(--reader-line)}
#audioPanel .audio-now{display:flex;flex-direction:column;align-items:center;justify-content:center;flex-wrap:wrap;column-gap:9px;row-gap:2px;white-space:normal;overflow:visible;opacity:1;margin:0;line-height:1.7;color:var(--reader-ink)}
#audioPanel .audio-surah-title{font-size:19px;font-weight:600;letter-spacing:-.4px}
#audioPanel .audio-ayah-label{font-size:10px;color:var(--reader-muted)}
#audioPanel .audio-queue-tools{position:absolute;inset-inline-end:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:0}
#audioPanel .audio-queue-link{position:relative;inset:auto;top:auto;transform:none;flex:0 0 44px;width:44px;height:44px;border:1px solid transparent;color:var(--reader-muted);background:transparent;opacity:.7}
#audioPanel .audio-queue-link.active{color:var(--reader-gold);opacity:1}
#audioPanel .audio-queue-link:hover,#audioPanel .audio-queue-link:focus-visible{background:var(--reader-selected);opacity:1}
#audioPanel .audio-queue-link span{top:1px;inset-inline-end:0}
#audioPanel .audio-queue-toggle{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--reader-muted);cursor:pointer;flex:none}
#audioPanel .audio-queue-toggle:disabled{opacity:.35;cursor:default}
#audioPanel .audio-queue-toggle:focus-visible{outline:2px solid var(--reader-gold);outline-offset:1px}
#audioPanel .audio-queue-toggle-track{position:relative;width:30px;height:18px;border:1px solid var(--reader-line);border-radius:20px;background:var(--reader-line);transition:background .16s}
#audioPanel .audio-queue-toggle-track:after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--reader-surface);transition:transform .16s}
#audioPanel .audio-queue-toggle[aria-checked="true"] .audio-queue-toggle-track{background:var(--reader-action);border-color:var(--reader-gold)}
#audioPanel .audio-queue-toggle[aria-checked="true"] .audio-queue-toggle-track:after{transform:translateX(-12px)}
@media(prefers-reduced-motion:reduce){#audioPanel .audio-queue-toggle-track,#audioPanel .audio-queue-toggle-track:after{transition:none}}
#audioPanel .audio-queue-link span{background:var(--reader-line);color:var(--reader-muted);box-shadow:0 0 0 2px var(--reader-surface)}
#audioPanel .audio-queue-link.active span{background:var(--reader-gold);color:var(--reader-on-action)}
#audioPanel .audio-progress-row{margin:0 1px;gap:8px;grid-template-columns:38px minmax(0,1fr) 38px}
#audioPanel .audio-progress-time{font-size:9px;color:var(--reader-muted)}
#audioPanel .audio-progress:before{background:var(--reader-line);height:3px}
#audioPanel .audio-progress i{background:linear-gradient(90deg,#C69B4B,#E4C980);height:3px}
#audioPanel #progressSeek::-webkit-slider-thumb{background:#D5B16A;border-color:var(--reader-surface);width:12px;height:12px;box-shadow:0 0 0 1px var(--reader-line)}
#audioPanel #progressSeek::-moz-range-thumb{background:#D5B16A;border-color:var(--reader-surface)}
#audioPanel .audio-controls{display:grid;grid-template-columns:48px minmax(32px,1fr) 70px minmax(32px,1fr) 48px;gap:8px;align-items:center;margin-top:9px}
#audioPanel .audio-control{width:44px;height:44px;justify-self:center}
#audioPanel .audio-control svg{width:21px;height:21px}
html #audioPanel #panelPlay.audio-main{width:64px;height:64px;background:var(--reader-action)!important;color:var(--reader-on-action)!important;border:1px solid rgba(187,146,63,.5)!important;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 6px 18px -8px rgba(167,120,29,.65);font-size:22px}
#audioPanel .audio-pill{height:38px;font-size:10px;padding-inline:8px}
html #audioPanel #continuousBtn,html #audioPanel #continuousBtn.active{
  background:var(--reader-raised)!important;color:var(--reader-muted)!important;border-color:var(--reader-line)!important;
  outline:none;box-shadow:none;font-size:9px;font-weight:500;position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);width:58px;height:30px;
}
html #audioPanel #continuousBtn.active,html #audioPanel #repeatBtn.active{background:var(--reader-selected)!important;color:var(--reader-gold)!important;border-color:var(--reader-gold)!important;box-shadow:none}
#audioPanel button:focus-visible,#audioPanel .audio-qari-wrap:focus-within{outline:2px solid var(--reader-gold);outline-offset:3px}
#audioPanel .audio-round:hover,#audioPanel .audio-control:not(.audio-main):hover,#audioPanel .audio-pill:hover{border-color:var(--reader-gold);background:var(--reader-selected)!important}
#audioPanel #stopPlayer{border-color:transparent;background:transparent!important;color:var(--reader-muted)!important}
.backdrop{background:rgba(3,22,18,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
html .backdrop .sheet{background:radial-gradient(ellipse at 50% 0%,rgba(228,201,128,.08),transparent 70%),var(--reader-surface)!important;color:var(--reader-ink);border:1px solid var(--reader-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 22px 65px -20px var(--reader-shadow)}
.backdrop .sheethead{border-color:var(--reader-line)}

.backdrop .sheethead:after{background:var(--reader-gold)}
html .backdrop .close-sheet,html .backdrop .quran-options-sheet .close-sheet,.backdrop .queue-toolbar button,.backdrop .queue-actions button,.backdrop .timer-presets button{
  background:var(--reader-raised);color:var(--reader-ink);border:1px solid var(--reader-line);border-radius:11px;
}
html .backdrop .field select{background:var(--reader-raised);color:var(--reader-ink);border-color:var(--reader-line)}
html .backdrop .field label,.backdrop .player-hint,.backdrop .timer-column-title,.backdrop .timer-nudge{color:var(--reader-muted);opacity:1}
html .backdrop .apply{background:var(--reader-action)!important;color:var(--reader-on-action)!important;border:1px solid var(--reader-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 16px -10px rgba(167,120,29,.5);font-weight:600}
.backdrop .queue-row{background:var(--reader-raised);border-color:var(--reader-line)}
.backdrop .queue-row.current{background:var(--reader-selected);border-color:var(--reader-gold)}
.backdrop .queue-track,.backdrop .queue-handle{color:var(--reader-ink)}
.backdrop .queue-track small{color:var(--reader-muted);opacity:1}
.backdrop .timer-wheel-wrap{background:var(--reader-well);border-color:var(--reader-line)}

/* Verse context belongs to its own header cell; notifications sit below the toolbar. */
html .topbar{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;
  padding:calc(9px + env(safe-area-inset-top)) 13px 12px;
  background:linear-gradient(180deg,var(--reader-surface) 0%,var(--reader-surface) 70%,transparent 100%);
}
html .topbar .quran-home-link{grid-column:1;grid-row:1;color:var(--reader-ink)!important;white-space:nowrap}

html .topbar .iconbtn{width:40px;height:40px;background:var(--reader-raised)!important;color:var(--reader-gold);border-color:var(--reader-line);box-shadow:none}

.reader-context{
  grid-column:2;grid-row:1;justify-self:center;min-width:0;width:100%;max-width:190px;min-height:40px;
  display:grid;align-content:center;gap:1px;padding:4px 7px;border:1px solid var(--reader-line);border-radius:13px;
  background:var(--reader-raised);color:var(--reader-ink);text-align:center;pointer-events:none;
  opacity:0;transition:opacity .16s;overflow:hidden;
}

.queue-source-label input{position:absolute;inset-inline-end:0;width:48px;height:44px;margin:0;opacity:0;cursor:pointer}
.queue-switch{width:44px;height:26px;flex:none;border:1px solid var(--reader-line);border-radius:20px;background:var(--reader-line);transition:background .16s;pointer-events:none;position:relative}
.queue-switch::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--reader-surface);box-shadow:0 1px 3px #0002;transition:transform .16s}
.queue-source-label input:checked+.queue-switch{background:var(--reader-action);border-color:var(--reader-gold)}

.audio-verse-settings[hidden],.player-backdrop .field[hidden]{display:none!important}

/* Surah rows and Juz separators share one set of measurements, so their page
   numbers sit in a single column by construction at every width. The values are
   the ones Surah rows already used; separators reserve exactly the width of the
   three row actions (play, share, download). */
/* بين الأزرار ‎8px‎ لتتباعد عناوينها في الشريط فوقها؛ في أضيق الشاشات (‎350px‎ وأقل) تبقى ‎4px‎ كي لا تُقصّ أسماء السور. */
.quran-index{--ix-pad-left:12px;--ix-pad-right:14px;--ix-gap:9px;--ix-num:42px;--ix-page:50px;--ix-page-gap:8px;--ix-btn:40px;--ix-btn-gap:8px}

html body .quran-index .quran-index-juz-page{width:var(--ix-page);min-width:var(--ix-page)}

/* Zad's four sections under the Quran index (the same bar as on the home screen). */
/* Same box as the home bar (.zk-tabs): 72px tall plus the safe area, blurred ground. */
.reader-app-tabs{flex:none;position:relative;box-sizing:border-box;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:calc(72px + env(safe-area-inset-bottom));padding:0 10px env(safe-area-inset-bottom);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  direction:rtl;border-top:1px solid rgba(169,131,58,.26);background:rgba(255,251,242,.94);font-family:"Alexandria",Tahoma,Arial,sans-serif;
  --app-tab:#6B6350;--app-tab-on:#0D3C35}
html[data-theme="dark"] .reader-app-tabs{border-top-color:rgba(228,201,128,.18);background:rgba(8,38,33,.94);--app-tab:#A9A390;--app-tab-on:#E4C980}
.reader-app-tabs a{position:relative;display:flex;transition:color .3s ease,background-color .3s ease;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:8px 2px;
  color:var(--app-tab);text-decoration:none;-webkit-tap-highlight-color:transparent}
.reader-app-tabs svg{width:23px;height:23px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.reader-app-tabs a[aria-current="page"] span{font-weight:650}
/* One marker that slides to the chosen tab, as on the home screen (RTL: counted from the right). */
.reader-app-dot{position:absolute;top:-1px;right:calc(10px + var(--app-tab-i,1) * (100% - 20px) / 5);width:calc((100% - 20px) / 5);display:flex;justify-content:center;
  pointer-events:none;transition:right .45s cubic-bezier(.3,.9,.3,1)}
.reader-app-dot::before{content:"";width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--app-tab-on)}
.reader-app-tabs a:focus-visible{outline:2px solid #C59A4A;outline-offset:-4px;border-radius:12px}
@media (min-width:371px){.reader-app-tabs span{white-space:nowrap}}
@media (max-width:350px){.reader-app-tabs span{font-size:10px}}
/* On wide screens: a floating pill, never stretched across the window. */
@media (min-width:860px){
  .reader-app-tabs{align-self:center;display:flex;gap:4px;min-height:0;height:58px;margin:10px 0 18px;padding:6px;
    border:1px solid rgba(169,131,58,.26);border-radius:20px;box-shadow:0 18px 40px -20px rgba(69,52,21,.28)}
  html[data-theme="dark"] .reader-app-tabs{border-color:rgba(228,201,128,.18);box-shadow:0 18px 40px -20px rgba(0,0,0,.55)}

  .reader-app-tabs a[aria-current="page"]{background:rgba(197,154,74,.14)}
  html[data-theme="dark"] .reader-app-tabs a[aria-current="page"]{background:rgba(228,201,128,.11)}
  .reader-app-dot{display:none}

/* Same as the home page: cross-fade between the two app pages; the tabs hold still. */
@view-transition{navigation:auto}

/* As on the home bar: labels reserve their bold width, so nothing shifts when the current tab changes. */

/* ---------- تبويب «الاستماع» ---------- */
.zad-listen{--zl-ink:#173E35;--zl-muted:#6B6350;--zl-surface:#FFFBF2;--zl-line:rgba(169,131,58,.26);--zl-gold:#8E6A28;--zl-gold-2:#C59A4A;--zl-gold-3:#E4C980;
  position:fixed;inset:0;z-index:126;display:flex;flex-direction:column;direction:rtl;background:var(--paper);color:var(--zl-ink);font-family:Alexandria,system-ui,sans-serif;isolation:isolate}
.zad-listen::after{content:"";position:absolute;inset:0 0 auto;height:260px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% -10%,rgba(228,201,128,.22),transparent 70%)}
html[data-theme="dark"] .zad-listen{--zl-ink:#FFF5DC;--zl-muted:#C1BBA7;--zl-surface:#0A2B26;--zl-line:rgba(228,201,128,.18);--zl-gold:#E4C980;--zl-gold-2:#E4C980}

body.zl-open .audio-panel,body.zl-open .audio-fab{display:none!important}
/* المصحف تحت المشغّل لا يُرى، فلا يُرسم ولا يُعاد تلوينه مع كل تغيير (كالوضع الليلي).
   يُضبط من جديد عند العودة إليه (readerAfterListen في appearance.js). */
body.zl-open #reader{content-visibility:hidden}
.zad-listen button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.zl-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(14px + env(safe-area-inset-top)) 16px 28px}

/* النقش في الخلفية كالرئيسية: ٤٪ نهارًا و٣٪ ليلًا، يجري ببطء. */
.zl-pattern{position:absolute;top:-60px;left:-60px;right:-320px;bottom:-220px;z-index:-1;pointer-events:none;opacity:.04;
  background:url("/icons/zad-rosette.svg") 0 0/496.31px 329.9px repeat;animation:zlFlow 60s linear infinite}
html[data-theme="dark"] .zl-pattern{opacity:.03}
.zad-listen{overflow:hidden}

.zl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 14px}
.zl-theme{flex:none;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid var(--zl-line);border-radius:14px;background:var(--zl-surface);color:var(--zl-gold-2);cursor:pointer}
.zl-theme svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.zl-sun{display:none}html[data-theme="dark"] .zl-sun{display:block}html[data-theme="dark"] .zl-moon{display:none}
.zl-head h1{margin:0;font:700 30px/1.7 "Aref Ruqaa",serif;color:var(--zl-ink)}

/* البطاقة: بطاقة الصلاة نفسها، والقوس تقدّم السورة */
.zl-card{position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:16px 16px 0;color:#FFF9EA;
  background:radial-gradient(circle at 30% 30%,rgba(228,201,128,.14),transparent 18rem),linear-gradient(145deg,#0D3C35,#082D29);box-shadow:0 18px 40px -22px rgba(6,40,35,.65)}
.zl-card-pattern{position:absolute;top:-60px;left:-60px;right:-320px;bottom:-220px;z-index:-1;opacity:.056;pointer-events:none;
  background:url("/icons/zad-rosette.svg") 0 0/496.31px 329.9px repeat;animation:zlFlow 60s linear infinite;animation-play-state:paused}
/* النقش في البطاقة يجري مع التلاوة ويقف بوقوفها. */
.zl-card.playing .zl-card-pattern{animation-play-state:running}
.zl-eyebrow{display:flex;align-items:center;justify-content:center;gap:7px;min-height:18px;font-size:12px;color:rgba(255,249,234,.74)}
.zl-wave{display:inline-flex;align-items:flex-end;gap:2px;height:12px}

.zl-wave.on i{animation:zlWave 1s ease-in-out infinite}
.zl-wave.on i:nth-child(2){animation-delay:-.3s}.zl-wave.on i:nth-child(3){animation-delay:-.6s}.zl-wave.on i:nth-child(4){animation-delay:-.15s}
