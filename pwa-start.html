<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5C50">
<title>زاد الخير</title>
<style>html,body{margin:0;min-height:100%;background:#061F1D}</style>
</head>
<body>
<script>
(()=>{
  const ID_KEY='zad:pwa-install-id';
  const SENT_KEY='zad:pwa-standalone-reported-v1';
  const URL='https://webqpbcijjbawatykoxe.supabase.co';
  const KEY='sb_publishable_51JPJ2XgwWW5l66bwqHN3Q_CJrEtyZv';
  const VERSION='v105';
  function uuid(){
    try{
      let id=localStorage.getItem(ID_KEY);
      if(id&&/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id))return id;
      if(crypto.randomUUID)id=crypto.randomUUID();
      else{
        const b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
        const h=[...b].map(v=>v.toString(16).padStart(2,'0')).join('');
        id=`${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
      }
      localStorage.setItem(ID_KEY,id);return id;
    }catch(_){return null;}
  }
  function platform(){
    const u=navigator.userAgent||'';
    if(/Android/i.test(u))return'android';
    if(/iPad|iPhone|iPod/i.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))return'ios';
    if(/Windows|Macintosh|Linux/i.test(u))return'desktop';
    return'other';
  }
  const go=()=>location.replace('./');
  (async()=>{
    try{
      if(localStorage.getItem(SENT_KEY)!=='1'){
        const id=uuid();
        if(id){
          const r=await fetch(`${URL}/rest/v1/rpc/record_pwa_install`,{
            method:'POST',
            headers:{'Content-Type':'application/json',apikey:KEY,Authorization:`Bearer ${KEY}`},
            body:JSON.stringify({p_device_id:id,p_platform:platform(),p_event:'standalone_open',p_app_version:VERSION})
          });
          if(r.ok)localStorage.setItem(SENT_KEY,'1');
        }
      }
    }catch(_){ }
    go();
  })();
  setTimeout(go,1200);
})();
</script>
</body>
</html>
