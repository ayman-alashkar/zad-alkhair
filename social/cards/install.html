<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بطاقة مشاركة تثبيت زاد الخير</title>
<!-- مصدر صورة المشاركة. تُصدَّر بقياس 1200×675 عبر scripts/build-share-cards.cjs -->
<style>
@font-face{font-family:"Alexandria";src:url("../../fonts/alexandria-arabic-400-800.woff2") format("woff2");font-weight:400 800;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E}
@font-face{font-family:"Alexandria";src:url("../../fonts/alexandria-latin-400-800.woff2") format("woff2");font-weight:400 800;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Amiri";src:url("../../fonts/amiri-arabic-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Amiri";src:url("../../fonts/amiri-arabic-700.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Aref Ruqaa";src:url("../../fonts/aref-ruqaa-arabic-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Aref Ruqaa";src:url("../../fonts/aref-ruqaa-arabic-700.woff2") format("woff2");font-weight:700}
body{margin:0}
.zs-ground::before{content:"";position:absolute;inset:0;opacity:.05;background:url("../../icons/zad-rosette.svg") -60px -40px/496.31px 329.9px repeat;pointer-events:none}
.zs-tile::before{content:"";position:absolute;inset:0;opacity:.08;background:url("../../icons/zad-rosette.svg") 40px 20px/248px 165px repeat;pointer-events:none}
</style>
</head>
<body>
<div class="zs-ground" dir="rtl" style="position: relative; width: 1200px; height: 675px; overflow: hidden; box-sizing: border-box; background: radial-gradient(circle at 50% -10%, rgba(213,177,106,.22), transparent 520px), #F5F0E4; font-family: Alexandria, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px">
<div style="position: relative; width: 900px; box-sizing: border-box; padding: 56px 60px; border-radius: 44px; background: #FFFBF2; border: 1px solid rgba(169,131,58,.26); box-shadow: 0 40px 80px -50px rgba(69,52,21,.6); display: flex; flex-direction: row; align-items: center; gap: 52px">
<div class="zs-tile" style="position: relative; flex: none; width: 230px; height: 230px; border-radius: 56px; overflow: hidden; background: radial-gradient(circle at 30% 25%, rgba(228,201,128,.18), transparent 200px), linear-gradient(145deg, #0D3C35, #082D29); box-shadow: 0 24px 44px -24px rgba(8,45,41,.8); display: flex; align-items: center; justify-content: center">
<img src="../../icons/zad-mark-reverse.svg" alt="" aria-hidden="true" style="position: relative; width: 150px; height: 150px">
</div>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0">
<div style="font-size: 22px; font-weight: 600; color: #8E6A28">تطبيق زاد الخير</div>
<div style="font-family: 'Aref Ruqaa', serif; font-weight: 700; font-size: 92px; line-height: 1.45; color: #173E35">ثبّته على جهازك</div>
<div style="font-size: 23px; color: #6B6350; line-height: 1.7">آيفون وأندرويد والحاسب، بلا متجر تطبيقات</div>
<div style="margin-top: 14px; display: flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 18px; background: #0D3C35; color: #FFF9EA; font-size: 24px; font-weight: 600">
<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#E4C980" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11"></path><path d="m7.5 10.5 4.5 4.5 4.5-4.5"></path><path d="M4.5 16.5v2.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-2.5"></path></svg>
<span>ثبّت التطبيق</span>
</div>
</div>
</div>
<div style="position: relative; font-size: 22px; font-weight: 600; letter-spacing: .06em; color: #8E6A28; direction: ltr">zad-alkhair.net/install</div>
</div>
</body>
</html>
