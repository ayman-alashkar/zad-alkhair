<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>صورة بوت تلغرام</title>
<!-- صورة ملف بوت تلغرام، 1024×1024. يعرضها تلغرام دائرة، فالشعار داخل حدود الدائرة. تُصدَّر عبر scripts/build-share-cards.cjs -->
<style>
body{margin:0}
.zs-tile::before{content:"";position:absolute;inset:0;opacity:.06;background:url("../../icons/zad-rosette.svg") 16px -60px/620px 412px repeat;pointer-events:none}
</style>
</head>
<body>
<div class="zs-tile" style="position: relative; width: 1024px; height: 1024px; overflow: hidden; background: radial-gradient(circle at 34% 26%, rgba(228,201,128,.18), transparent 560px), linear-gradient(145deg, #0D3C35, #082D29); display: flex; align-items: center; justify-content: center">
<img src="../../icons/zad-mark-reverse.svg" alt="" style="position: relative; width: 600px; height: 600px; margin-top: -10px">
</div>
</body>
</html>
