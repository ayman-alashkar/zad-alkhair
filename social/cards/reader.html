<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بطاقة مشاركة قارئ زاد الخير</title>
<!-- مصدر صورة المشاركة. تُصدَّر بقياس 1200×675 عبر scripts/build-share-cards.cjs -->
<style>
@font-face{font-family:"Alexandria";src:url("../../fonts/alexandria-arabic-400-800.woff2") format("woff2");font-weight:400 800;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E}
@font-face{font-family:"Alexandria";src:url("../../fonts/alexandria-latin-400-800.woff2") format("woff2");font-weight:400 800;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Amiri";src:url("../../fonts/amiri-arabic-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Amiri";src:url("../../fonts/amiri-arabic-700.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Aref Ruqaa";src:url("../../fonts/aref-ruqaa-arabic-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Aref Ruqaa";src:url("../../fonts/aref-ruqaa-arabic-700.woff2") format("woff2");font-weight:700}
body{margin:0}
.zs-ground::before{content:"";position:absolute;inset:0;opacity:.05;background:url("../../icons/zad-rosette.svg") -60px -40px/496.31px 329.9px repeat;pointer-events:none}
.zs-hero::before{content:"";position:absolute;inset:0;opacity:.05;background:url("../../icons/zad-rosette.svg") 120px 40px/496.31px 329.9px repeat;pointer-events:none}
.zs-gold{background:linear-gradient(160deg,#FFF9EA 10%,#E4C980 55%,#C59A4A 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
</style>
</head>
<body>
<div class="zs-ground" dir="rtl" style="position: relative; width: 1200px; height: 675px; overflow: hidden; box-sizing: border-box; background: radial-gradient(circle at 50% -10%, rgba(213,177,106,.22), transparent 520px), #F5F0E4; font-family: Alexandria, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px">
<div class="zs-hero" style="position: relative; width: 860px; height: 470px; box-sizing: border-box; border-radius: 44px; overflow: hidden; background: radial-gradient(circle at 30% 25%, rgba(228,201,128,.16), transparent 420px), linear-gradient(145deg, #0D3C35, #082D29); box-shadow: 0 40px 80px -46px rgba(69,52,21,.75); border: 1px solid rgba(228,201,128,.28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 999px; background: rgba(228,201,128,.12); border: 1px solid rgba(228,201,128,.3); color: #E4C980; font-size: 22px; font-weight: 600">
<svg data-card-icon viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.25C10.15 4.85 7.95 4.2 5.15 4.2v12.65c2.75.02 5.08.78 6.85 2.25 1.77-1.47 4.1-2.23 6.85-2.25V4.2c-2.8 0-5 .65-6.85 2.05Z"></path><path d="M12 6.25V19.1"></path><path d="M4 6.25v12.8c3.15-.15 5.82.55 8 2 2.18-1.45 4.85-2.15 8-2V6.25"></path></svg>
<span data-card-label>قارئ زاد الخير</span>
</div>
<div class="zs-gold" style="position: relative; font-family: 'Aref Ruqaa', serif; font-weight: 700; font-size: 124px; line-height: 1.5">القرآن العظيم</div>
<div style="position: relative; width: 300px; height: 1px; background: linear-gradient(90deg, transparent, rgba(228,201,128,.6), transparent)"></div>
<div style="position: relative; margin-top: 14px; font-family: Amiri, serif; font-size: 36px; color: rgba(255,249,234,.82)">قراءة · استماع · التفسير الوجيز</div>
</div>
<div data-card-address style="position: relative; font-size: 22px; font-weight: 600; letter-spacing: .06em; color: #8E6A28; direction: ltr">zad-alkhair.net/quran-read</div>
</div>
</body>
</html>
